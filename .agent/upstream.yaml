# 与上游的差异（不得伪称为上游功能）：
divergence:
  - Task 分类目录、layout 清单、migrate/rollback CLI 与索引 category 列均为本项目扩展，上游 V4.3.0 无此机制。
  - layout.yaml 只表达导航分类与证据类型，不是 State、不是审批证据，不参与 Gate 计算。
  - 上游后续发布若引入同类能力，应按 .agent/specs/TaskLayoutExtension.md 第 8 节合并而非覆盖。

# 未解决的兼容限制：
compat:
  - 历史 schema 2/3 与 schema 0 Task 只读（T0）；继续需 Owner 逐任务授权 T1 新 Task 承继；不提供 T2 原地升级。
  - 3 个 schema 0 Task 的 State 不可解析，索引仍标 corrupt；分类为 blocked/archive 并记录人工证据，不冒充完成。
  - 19 个无 state.yaml 的 Task 依赖 delivery.md 等文档证据；basis=document/unknown，无法机器核验。
  - recommendation-v1 的旧 SHA 不在 develop 历史中，分类为 completed/document 并在 owner-decisions 记录限制。
  - 历史 Task 内的旧路径文本（如 .agent/tasks/<id>/）保留为历史事实，不回写。
  - 本次未执行真实 Agent E2E（不伪造 Owner 批准/Task），仅完成 Engine 测试、CLI、迁移与业务回归验证。
