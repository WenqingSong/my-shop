$:
  vscode:
    - runner:
        cpus: 8
      docker:
        image: docker.cnb.cool/arthur-cloud-native/jetbrains/goland:5.0.1
      services:
        - vscode
        - docker
      stages:
        - name: docker-compose-up
          script: docker compose up -d

main:
  push:
    - name: check-github-secret
      imports:
        - https://cnb.cool/framework-station/my-shop-secrets/-/blob/main/github-mirror.yml
      stages:
        - name: check-github-credential
          script: |
            test -n "${GITHUB_USERNAME:-}"
            test -n "${GITHUB_TOKEN:-}"
            echo "GitHub mirror credential loaded successfully"