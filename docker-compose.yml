services:
  mysql:
    image: mysql:8.0
    container_name: my-shop-mysql
    restart: unless-stopped
    environment:
      # MySQL root 密码无内置默认回退：必须经 .env / 环境变量显式注入，缺失即启动失败。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-my_shop}
    ports:
      # 回环绑定：仅宿主机本机可连（开发与压测 verify() 经 127.0.0.1 连库），不对外暴露。
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: my-shop-redis
    restart: unless-stopped
    ports:
      # 回环绑定：仅宿主机本机可连（开发与压测经 127.0.0.1），不对外暴露。
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Kafka 本地开发环境（B4 起可接入秒杀链路）。
  #
  # 使用官方 Apache Kafka 镜像 + KRaft 单节点（Broker 与 Controller 合一），不依赖 ZooKeeper。
  # 单节点开发配置：Replication Factor=1、min.insync.replicas=1，仅用于本地联调，
  # 不具备 Broker 故障容忍能力；生产需 3 Broker、RF=3、min.insync.replicas=2。
  #
  # 通过 profiles 隔离：默认 `docker compose up -d` 不启动 Kafka，不改变现有服务默认启动行为；
  # 需要时显式启动：`docker compose --profile kafka up -d kafka`，并按 docs/development/kafka.md
  # 显式创建业务 Topic 与死信 Topic。
  # app 默认 FLASH_SALE_DISPATCH_MODE=db_scanner、FLASH_SALE_KAFKA_ENABLED=false，
  # 不会创建任何 Kafka 客户端；启用 Kafka 模式时需同时打开两个开关并重启 app。
  kafka:
    image: apache/kafka:3.9.1
    container_name: my-shop-kafka
    restart: unless-stopped
    profiles: ["kafka"]
    environment:
      # 固定 CLUSTER_ID：数据卷已格式化后容器重建仍能复用同一 KRaft 集群元数据。
      CLUSTER_ID: "a6SsLG7YBxBAeqa-3gKwgg"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 三个监听器：容器内 PLAINTEXT（kafka:9092）、KRaft 控制器、宿主机 PLAINTEXT_HOST。
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092"
      # 对外广播地址必须与客户端实际访问地址一致：
      # 容器内客户端用 kafka:9092，宿主机客户端用 127.0.0.1:29092。
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://127.0.0.1:${KAFKA_PORT:-29092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 本地单节点：内部 Topic 与业务 Topic 均为 RF=1 / min.insync.replicas=1。
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topic 必须显式创建，不依赖 Broker 自动建 Topic（避免分区/副本数不可控）。
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      # 回环绑定：仅宿主机本机可连（与 MySQL/Redis 一致），不对外暴露。
      - "127.0.0.1:${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # 用 Kafka 自带 CLI 校验 Broker API 可用，而不是只探测端口：
      # 端口可连但 KRaft 尚未完成选举时，生产/消费仍会失败。
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
    image: my-shop-app:local
    # Compose 本地开发保留迁移后启动；生产镜像默认直接 exec serve，
    # 多副本部署需先独立执行 migration，再启动应用副本。
    entrypoint: ["/app/docker-entrypoint.sh"]
    container_name: my-shop-app
    restart: unless-stopped
    # 依赖编排：mysql/redis 健康后才启动 app；应用内 waitForDependencies 再重试兜底。
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: ":8000"
      # 服务间通过 Compose DNS 名通信（mysql / redis / app），不依赖宿主机 host.docker.internal。
      DATABASE_DEFAULT_TYPE: "mysql"
      DATABASE_DEFAULT_HOST: "mysql"
      DATABASE_DEFAULT_PORT: "3306"
      DATABASE_DEFAULT_USER: "root"
      # MySQL 密码与 mysql 服务共用同一 root 凭据，无内置默认回退：缺失即启动失败。
      DATABASE_DEFAULT_PASS: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}"
      DATABASE_DEFAULT_NAME: "${MYSQL_DATABASE:-my_shop}"
      DATABASE_DEFAULT_CHARSET: "utf8mb4"
      DATABASE_DEFAULT_DEBUG: "false"
      REDIS_DEFAULT_ADDRESS: "redis:6379"
      REDIS_DEFAULT_DB: "0"
      REDIS_DEFAULT_PASS: ""
      # JWT 密钥：敏感凭据，无内置默认回退，必须经 .env / 环境变量 / 平台 Secret 注入，缺失即启动失败。
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET required}"
      ADMIN_SUPER_USERNAME: "${ADMIN_SUPER_USERNAME:-admin}"
      # 超管初始密码：无默认值，首次建号必须注入，否则 serve fail-fast（已有超管则幂等跳过）。
      ADMIN_SUPER_PASSWORD: "${ADMIN_SUPER_PASSWORD:-}"
      # 本地文件存储：app_storage named volume（容器重建不丢失）。
      STORAGE_LOCAL_ROOT: "/app/storage"
      STARTUP_DEPENDENCY_TIMEOUT: "${STARTUP_DEPENDENCY_TIMEOUT:-30}"
      # 七牛云（serve 启动 required dependency，缺失 fail-fast，不泄漏凭据值）。
      QINIU_ACCESS_KEY: "${QINIU_ACCESS_KEY:-}"
      QINIU_SECRET_KEY: "${QINIU_SECRET_KEY:-}"
      QINIU_BUCKET: "${QINIU_BUCKET:-}"
      QINIU_DOMAIN: "${QINIU_DOMAIN:-}"
      QINIU_REGION: "${QINIU_REGION:-z2}"
      QINIU_TOKEN_TTL: "${QINIU_TOKEN_TTL:-3600}"
      QINIU_MAX_FILE_SIZE: "${QINIU_MAX_FILE_SIZE:-10485760}"
      # 秒杀指标开关（Prometheus /metrics 暴露开关，默认关闭）。
      FLASH_SALE_METRICS_ENABLED: "${FLASH_SALE_METRICS_ENABLED:-false}"
      # 秒杀消费模式：db_scanner（默认，不依赖 Kafka）或 kafka（需同时启用 Kafka 开关）。
      FLASH_SALE_DISPATCH_MODE: "${FLASH_SALE_DISPATCH_MODE:-db_scanner}"
      FLASH_SALE_KAFKA_ENABLED: "${FLASH_SALE_KAFKA_ENABLED:-false}"
      # 容器内使用 Compose DNS 名；未启用 Kafka 时这些值不会建立连接。
      FLASH_SALE_KAFKA_BROKERS: "${FLASH_SALE_KAFKA_BROKERS:-kafka:9092}"
      FLASH_SALE_KAFKA_TOPIC: "${FLASH_SALE_KAFKA_TOPIC:-surgecart.flashsale.order.requested.v1}"
      FLASH_SALE_KAFKA_DLQ_TOPIC: "${FLASH_SALE_KAFKA_DLQ_TOPIC:-surgecart.flashsale.order.requested.v1.dlq}"
      FLASH_SALE_KAFKA_CONSUMER_GROUP: "${FLASH_SALE_KAFKA_CONSUMER_GROUP:-surgecart-flashsale-order-worker-v1}"
      FLASH_SALE_SHUTDOWN_TIMEOUT: "${FLASH_SALE_SHUTDOWN_TIMEOUT:-30s}"
    # 不映射宿主机端口：app 仅 Compose 网络内 app:8000 可达（Nginx 唯一对外入口的信任边界前提）。
    volumes:
      - app_storage:/app/storage
    # /health 为 liveness：serve 仅在 bootstrap（依赖/schema/seed/七牛）全部通过后才监听端口，
    # 可响应即代表依赖已就绪、schema 已就绪，无需独立 readiness 端点。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    build:
      context: ./nginx
    image: my-shop-nginx:local
    container_name: my-shop-nginx
    restart: unless-stopped
    # 待 app 健康后再启动：Nginx 作为唯一对外入口，依赖 app 已就绪。
    depends_on:
      app:
        condition: service_healthy
    # 唯一对外 HTTP 入口（${NGINX_PORT:-8080}），容器内监听 80。
    ports:
      - "${NGINX_PORT:-8080}:80"
    # 健康检查：经本容器回环探活，透传 app 的 /health（语义与 app 自身 healthcheck 一致）。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    build:
      context: ./prometheus
    image: my-shop-prometheus:local
    container_name: my-shop-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    # 抓取配置与 rules 经 prometheus/Dockerfile COPY 内置进镜像，而非 bind mount：
    # rootless / 嵌套容器环境下 bind mount 单文件会退化为目录挂载（文件变目录），
    # 导致容器启动失败。
    # 抓取目标为 Compose DNS 名 app:8000，无需经 host-gateway 打通宿主机端口。
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
  app_storage:
  # Kafka KRaft 数据（Topic 元数据、消息日志），容器重建不丢失。
  kafka_data:
