# 服务配置
server:
  # HTTP 监听地址，可通过环境变量 SERVER_ADDRESS 覆盖，例如 ":8080"
  address: ":8000"

# 数据库配置（以下均为开发默认值，可通过环境变量覆盖）
# 对应环境变量：DATABASE_DEFAULT_TYPE / HOST / PORT / USER / PASS / NAME / CHARSET / DEBUG
database:
  default:
    type: "mysql"
    host: "127.0.0.1"
    port: "3306"
    user: "root"
    pass: "root"
    name: "my_shop"
    charset: "utf8"
    debug: false

# Redis 配置（以下均为开发默认值，可通过环境变量覆盖）
# 对应环境变量：REDIS_DEFAULT_ADDRESS / DB / PASS
redis:
  default:
    address: "127.0.0.1:6379"
    db: 0
    pass: ""

# 认证配置（以下均为开发默认值，可通过环境变量覆盖）
# 对应环境变量：AUTH_JWT_SECRET / AUTH_SESSION_TTL
auth:
  jwt:
    # JWT 签名密钥（HS256）。
    # ⚠️ 开发环境默认值，仅用于本地/CI 每日重置环境。
    # 生产环境必须通过环境变量 AUTH_JWT_SECRET 注入真实密钥，禁止使用此默认值。
    secret: "c49d0fea5cf77761ca6d0275545b9501686dd40cc313b072c36972d6128fc403"
  session:
    # 会话 TTL（秒），默认 3600，与 JWT exp 对齐；必须大于 0。
    # 有效访问窗口 = min(JWT exp, 会话 TTL)。
    ttl: 3600
  refresh:
    # refresh token 绝对有效期（秒），默认 2592000（30 天）；必须大于 0。
    # 对应环境变量：AUTH_REFRESH_TTL。
    ttl: 2592000

# 后台管理员配置（以下均为开发默认值，可通过环境变量覆盖）
# 对应环境变量：ADMIN_SUPER_USERNAME / ADMIN_SUPER_PASSWORD
admin:
  super:
    # 超级管理员用户名（默认 admin，非机密）。
    username: "admin"
    # 超级管理员初始密码（仅用于「超级管理员尚不存在时」创建）。
    # ⚠️ 无开发默认值：未配置且需创建时启动失败，禁止静默用弱默认值建号。
    # 生产/开发均通过环境变量 ADMIN_SUPER_PASSWORD 注入。
    password: ""

# 运营数据大屏配置（以下均为开发默认值，可通过环境变量覆盖）
# 对应环境变量：DASHBOARD_TIMEZONE
dashboard:
  # 日期切分时区（系统权威业务时区）：「今日零点」/趋势锚点/时间范围边界均按此时区计算，
  # 且 MySQL 会话时区会与之对齐（连接层 time_zone），保证 NOW()/CURRENT_TIMESTAMP 写值与统计边界一致。
  # 仅支持无夏令时（DST）的时区；配置含 DST 的时区（如 America/New_York）会在启动时被拒绝。
  timezone: "Asia/Shanghai"

# 订单配置（以下均为开发默认值，可通过环境变量覆盖）
# 对应环境变量：ORDER_PAY_TIMEOUT / ORDER_CANCEL_SCAN_INTERVAL
order:
  # 支付超时时长（秒），下单后超过此时长未支付将被自动取消。
  pay_timeout: 900
  # 超时未支付订单的后台扫描周期（秒）。
  cancel_scan_interval: 60

# 秒杀配置（以下均为开发默认值，可通过环境变量覆盖）
# 对应环境变量：FLASH_SALE_RECONCILE_SCAN_INTERVAL / FLASH_SALE_CONSUME_SCAN_INTERVAL
flash_sale:
  # 秒杀缓存对账/回补的后台扫描周期（秒）。
  reconcile_scan_interval: 60
  # 秒杀异步下单的消费扫描周期（秒），保证排队请求低延迟落单。
  consume_scan_interval: 1

  # 秒杀容量保护——限流（Redis 固定窗口计数器，窗口边界有毛刺，容量保护可接受）。
  # 仅聚焦秒杀下单链路；Redis 计数失败 fail-open（放行到闸门，闸门 fail-closed 兜底）。
  rate_limit:
    # 是否启用用户级/活动级限流。开发默认关闭；压测/生产建议开启。
    enabled: false
    user:
      # 用户级限流窗口（秒）。
      window_seconds: 1
      # 用户级限流阈值（单位窗口内最大请求数，<=0 表示不限）。
      max_requests: 0
    activity:
      # 活动级限流窗口（秒）。
      window_seconds: 1
      # 活动级限流阈值（单位窗口内最大请求数，<=0 表示不限）。
      max_requests: 0

  # 秒杀容量保护——排队软上限（activity×SKU 维度，Redis 近似计数 + MySQL 权威收敛）。
  queue_capacity:
    # 是否启用排队软上限。开发默认关闭；压测/生产建议开启。
    enabled: false
    # 单 activity×SKU 的 queued 请求软上限（<=0 表示不限）。
    max_queued_per_sku: 0
    # 排队计数 key 的兜底 TTL（秒），对账扫描器会按活动 TTL 刷新。
    counter_ttl_seconds: 86400

  # 秒杀容量保护——Redis 闸门熔断器（进程内状态机，多实例各自独立）。
  # 降级行为 = 快速失败（复用 1005/503，不降级到同步 MySQL 路径）。
  circuit_breaker:
    # 是否启用熔断。开发默认关闭；压测/生产建议开启。
    enabled: false
    # 连续失败达到该阈值后进入 Open。
    failure_threshold: 5
    # Open 持续该时长（秒）后进入 Half-Open 探测。
    open_timeout_seconds: 10
    # Half-Open 阶段允许放行的最大探测数。
    half_open_max_probes: 1

  # 秒杀可观测性——指标（Prometheus）。
  metrics:
    # 是否启用指标采集并暴露 GET /metrics（需内网/监控网段可达，避免泄漏流量与业务维度信息）。
    enabled: false

# 本地存储配置（以下均为开发默认值，可通过环境变量覆盖）
# 对应环境变量：STORAGE_LOCAL_ROOT
storage:
  local:
    # 本地文件存储根目录（轮播图占位图等运行时静态资源写入此目录）。
    root: "./storage"

# 七牛云对象存储（文件上传直传凭证签发）配置
# 对应环境变量：QINIU_ACCESS_KEY / QINIU_SECRET_KEY / QINIU_BUCKET / QINIU_DOMAIN /
#              QINIU_REGION / QINIU_TOKEN_TTL / QINIU_MAX_FILE_SIZE /
#              QINIU_ALLOWED_EXTENSIONS / QINIU_ALLOWED_MIME_TYPES
qiniu:
  # 七牛 AccessKey（凭据标识，非机密，启动 required dependency）。⚠️ 仅经环境变量 QINIU_ACCESS_KEY
  # 注入，禁止写死/提交；缺失时 serve 启动 fail-fast。
  access_key: ""
  # 七牛 SecretKey（机密，启动 required dependency）。⚠️ 仅经环境变量 QINIU_SECRET_KEY 注入，
  # 禁止写死/提交/进日志/响应；缺失时 serve 启动 fail-fast。
  secret_key: ""
  # 对象存储空间名（非敏感，启动 required dependency）。无默认值：可在本文件填写，或经环境变量
  # QINIU_BUCKET 覆盖；缺失时 serve 启动 fail-fast。
  bucket: ""
  # 对外访问域名（非敏感，启动 required dependency，拼接 final_url = domain/key）。可在本文件填写，
  # 或经环境变量 QINIU_DOMAIN 覆盖；缺失时 serve 启动 fail-fast。
  domain: ""
  # 七牛区域，映射上传主机（z0/z1/z2/na0/as0）。
  region: "z2"
  # 上传凭证有效期（秒），必须大于 0。
  token_ttl: 3600
  # 单文件大小上限（字节），固化进 token fsizeLimit，必须大于 0。
  max_file_size: 10485760
  # 后端扩展名预校验白名单（filename 声明）。
  allowed_extensions: ["jpg", "jpeg", "png", "gif", "webp"]
  # 固化进 token mimeLimit 的 MIME 白名单。
  allowed_mime_types: ["image/jpeg", "image/png", "image/gif", "image/webp"]

# 启动配置（以下均为开发默认值，可通过环境变量覆盖）
# 对应环境变量：STARTUP_DEPENDENCY_TIMEOUT
startup:
  dependency:
    # 启动依赖连通性校验超时时间（秒）
    timeout: 30
