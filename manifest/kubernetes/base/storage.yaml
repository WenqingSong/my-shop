# 应用持久化存储（PVC）。
#
# 事实依据（代码审计）：
#   - internal/cmd 在 serve 启动时用 storage.NewLocal(STORAGE_LOCAL_ROOT) 初始化本地存储，
#     并向 storage.local.root 写入轮播图占位图；/storage/banners 是静态路由。
#   - 七牛对象存储只用于「上传凭证签发」，文件本体由浏览器直传七牛，
#     不经过本服务，因此不能把七牛当成 /app/storage 的替代。
#   - 因此 /app/storage 必须持久化：容器重启后占位图与运维手工放入的文件不能丢失。
#
# 存储模型选择（三选一，见 docs/development/kubernetes.md §7）：
#   ✅ 单副本 + RWO PVC（当前默认）：与 Deployment replicas=1、strategy=Recreate 配套。
#   ⏸ 共享 RWX 存储：需要集群提供 RWX StorageClass（NFS/CephFS/EFS 等），
#      本仓库不假设其存在，也不写死任何厂商配置。
#   ⏸ 外部对象存储：需要把 LocalStorage 实现替换为对象存储实现（业务改造，不属于 T2-06）。
#
# 不指定 storageClassName：
#   - 使用集群默认 StorageClass；
#   - 集群没有默认 StorageClass 时，在 overlays/production 中按管理员提供的名称补一个 patch
#     （overlay 内有注释示例），而不是在 base 里写死某个云厂商的 StorageClass。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surgecart-storage
  labels:
    app.kubernetes.io/name: surgecart
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: surgecart
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 当前只承载轮播图占位图等小文件；5Gi 是保守下界，按实际用量调整。
      storage: 5Gi
