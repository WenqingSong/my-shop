# 应用凭据（Secret 模板）—— 只被 Application Deployment 引用。
#
# 与数据库凭据分离的原因：
#   - Migration Job 只需要 DATABASE_DEFAULT_PASS，不应接触 JWT / 超管 / 七牛凭据；
#   - 轮换 JWT 密钥或七牛 AK/SK 时不必改动迁移路径的注入面。
#
# ⚠️ 模板规则：
#   - 只允许占位符，禁止提交真实凭据；
#   - 禁止把凭据写进 ConfigMap、镜像、命令行参数或日志；
#   - Kubernetes Secret 的 base64 编码不是加密，生产需结合集群静态加密或外部密钥管理。
#
# 创建方式（值只存在于本地 shell 变量中）：
#   kubectl -n surgecart create secret generic surgecart-app-credentials \
#     --from-literal=REDIS_DEFAULT_PASS="$REDIS_DEFAULT_PASS" \
#     --from-literal=AUTH_JWT_SECRET="$AUTH_JWT_SECRET" \
#     --from-literal=ADMIN_SUPER_PASSWORD="$ADMIN_SUPER_PASSWORD" \
#     --from-literal=QINIU_ACCESS_KEY="$QINIU_ACCESS_KEY" \
#     --from-literal=QINIU_SECRET_KEY="$QINIU_SECRET_KEY"
#
# 说明：
#   - AUTH_JWT_SECRET 必须至少 32 字节，否则 serve 启动失败；
#   - ADMIN_SUPER_PASSWORD 只在超管首次创建时使用，初始化完成后可由部署流程轮换/删除；
#   - Redis 未启用认证时可将 REDIS_DEFAULT_PASS 置为空字符串，但键必须存在。
apiVersion: v1
kind: Secret
metadata:
  name: surgecart-app-credentials
  namespace: surgecart
  labels:
    app.kubernetes.io/name: surgecart
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: surgecart
type: Opaque
stringData:
  REDIS_DEFAULT_PASS: "REPLACE_WITH_REDIS_PASSWORD"
  # 至少 32 字节的随机串（openssl rand -base64 48）。
  AUTH_JWT_SECRET: "REPLACE_WITH_JWT_SECRET_AT_LEAST_32_BYTES"
  ADMIN_SUPER_PASSWORD: "REPLACE_WITH_SUPER_ADMIN_PASSWORD"
  QINIU_ACCESS_KEY: "REPLACE_WITH_QINIU_ACCESS_KEY"
  QINIU_SECRET_KEY: "REPLACE_WITH_QINIU_SECRET_KEY"
