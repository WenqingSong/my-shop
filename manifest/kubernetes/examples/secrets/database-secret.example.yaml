# 数据库凭据（Secret 模板）—— Application 与 Migration Job 共用。
#
# ⚠️ 本文件是模板，只允许存放占位符：
#   - 禁止把真实口令填入本文件后提交 Git；
#   - 禁止把口令写进 Dockerfile、镜像层、ConfigMap、Job 参数、命令行或日志；
#   - 生产环境应由 External Secrets / Sealed Secrets / Vault / CI 注入的同名 Secret 提供，
#     而不是 `kubectl apply -f` 本文件。
#
# Kubernetes Secret 的 base64 编码**不是加密**：任何能读取该命名空间 Secret 的人都能还原
# 明文。生产环境必须结合集群静态加密（EncryptionConfiguration / KMS provider）或外部密钥
# 管理系统，并配合最小权限 RBAC。
#
# 创建方式（口令只存在于本地 shell 变量中，不进入仓库与镜像）：
#   kubectl -n surgecart create secret generic surgecart-db-credentials \
#     --from-literal=DATABASE_DEFAULT_PASS="$DATABASE_DEFAULT_PASS"
#
# 两个入口都只引用这一个 Secret：迁移只用 DATABASE_DEFAULT_PASS，
# 应用另外需要 application-secret.example.yaml 中的凭据。
apiVersion: v1
kind: Secret
metadata:
  name: surgecart-db-credentials
  namespace: surgecart
  labels:
    app.kubernetes.io/name: surgecart
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: surgecart
type: Opaque
stringData:
  # 占位符必须被替换后才能连接数据库；保持原样时 MySQL 认证失败（非零退出、不泄漏值）。
  DATABASE_DEFAULT_PASS: "REPLACE_WITH_DATABASE_PASSWORD"
