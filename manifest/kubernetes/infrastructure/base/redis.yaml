# Redis 7（本地 Kubernetes，T2-07）。
#
# 版本与运行参数：redis:7-alpine + 默认 redis-server 参数 —— 与 docker-compose.yml 一致。
# 不引入密码、不引入 ACL、不修改 save 策略或 maxmemory：
#   - 现有项目（compose / config.yaml 默认值）的 Redis 是**无认证**的，REDIS_DEFAULT_PASS 为空；
#   - 为了 Kubernetes 部署而新增密码会改变全部客户端的连接语义（应用、脚本、压测），
#     属于业务语义变更，不在本任务范围内；
#   - 访问面由 ClusterIP 限制在集群内，宿主机访问需要显式 port-forward。
#   如果将来启用认证，必须同时修改：本文件的 args、Secret/surgecart-app-credentials 的
#   REDIS_DEFAULT_PASS，以及所有直连 Redis 的工具。
#
# 持久化：默认 RDB 快照写入 /data（PVC）。容器重建不丢数据，集群删除会丢（见 delete 告警）。
# 这里刻意不加 --appendonly：AOF 会改变写入放大与恢复时长，与现有开发环境不一致。
#
# 运行身份：官方镜像内置 redis 用户 uid=999（gid=1000），以 999:999 启动；
# 数据卷由 fsGroup=999 授权，只读根文件系统下 /tmp 单独挂 emptyDir。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: surgecart
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: surgecart
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: surgecart
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: surgecart
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # 收到 SIGTERM 时 Redis 会执行 SAVE（默认无 shutdown 命令时直接退出，RDB 由 save 点触发），
      # 30s 足够本地数据量；给足时间避免被 SIGKILL。
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          # 就绪：必须真的返回 PONG，而不是「端口可连」。
          # 加载中（LOADING）或只读副本（READONLY）都不会通过。
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test "$(redis-cli -h 127.0.0.1 ping)" = "PONG"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # 存活：进程还能应答 PING。15s × 3 = 45s 容忍窗口，避免瞬时 GC/慢查询导致重启。
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test "$(redis-cli -h 127.0.0.1 ping)" = "PONG"
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
        - name: tmp
          emptyDir: {}
