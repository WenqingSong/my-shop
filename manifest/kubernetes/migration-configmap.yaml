# T2-05 数据库迁移 Job 的非敏感配置（ConfigMap）。
#
# 边界：
#   - 只承载「泄露不构成凭据风险」的值：数据库地址、端口、用户、库名、字符集、严格模式开关；
#   - 数据库密码只能来自 Secret（见 migration-secret.example.yaml），不得写进本文件；
#   - 键名与 internal/config 契约注册表一致（docs/development/configuration.md §8）。
#
# T2-06 会把本文件纳入 Kustomize base，并按环境提供 overlays 覆盖 host/namespace。
apiVersion: v1
kind: ConfigMap
metadata:
  name: surgecart-migration-config
  namespace: surgecart
  labels:
    app.kubernetes.io/name: surgecart
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: surgecart
data:
  # T2-01 冻结的严格模式：缺少数据库地址/库名时迁移在连接数据库之前失败，
  # 不会静默连到容器内 localhost。
  DEPLOYMENT_REQUIRE_EXTERNAL_ENDPOINTS: "true"

  # 生产迁移必须使用外部数据库地址（集群内 Service DNS 或托管数据库域名），
  # 禁止 localhost / 127.0.0.1 / ::1。
  DATABASE_DEFAULT_TYPE: "mysql"
  DATABASE_DEFAULT_HOST: "mysql.surgecart.svc.cluster.local"
  DATABASE_DEFAULT_PORT: "3306"
  DATABASE_DEFAULT_USER: "surgecart"
  DATABASE_DEFAULT_NAME: "my_shop"
  DATABASE_DEFAULT_CHARSET: "utf8mb4"
  DATABASE_DEFAULT_DEBUG: "false"
