# T2-05 数据库迁移 Job。
#
# 定位：把 schema 变更从应用启动流程中独立出来，在 Deployment 升级之前单独执行一次。
#
#   kubectl -n surgecart apply -f manifest/kubernetes/migration-configmap.yaml
#   kubectl -n surgecart apply -f manifest/kubernetes/migration-secret.example.yaml   # 或改用外部注入的同名 Secret
#   kubectl -n surgecart delete job surgecart-migrate --ignore-not-found
#   kubectl -n surgecart apply -f manifest/kubernetes/migration-job.yaml
#   kubectl -n surgecart wait --for=condition=complete job/surgecart-migrate --timeout=15m
#
# 关键约束：
#   - 只执行 `migrate up`，永不执行 `migrate force`（force 是人工风险操作）；
#   - 并发保护来自数据库 GET_LOCK，不依赖 Job 的 parallelism（跨 Pod 才有效）；
#   - 非 root、只读根文件系统、capabilities 全丢弃，与 T2-04 应用容器同等级加固；
#   - 镜像使用不可变版本标签（短 SHA），不使用 latest 作为迁移锚点。
apiVersion: batch/v1
kind: Job
metadata:
  name: surgecart-migrate
  namespace: surgecart
  labels:
    app.kubernetes.io/name: surgecart
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: surgecart
spec:
  # 一个 Job 只跑一个 Pod：并发保护由数据库级锁提供，
  # parallelism>1 只会制造无意义的锁等待。
  parallelism: 1
  completions: 1

  # 失败重试：数据库暂不可达、锁等待 10s 超时（另一个迁移正在执行）都可通过重试收敛。
  # 迁移内容本身失败会进入 dirty 状态，重试不会绕过（也不会自动 force）。
  backoffLimit: 4

  # 单个 Pod 的最长运行时间：覆盖 37 张表的全量建表与后续增量迁移；
  # 超时由 kubelet 终止 Pod，避免 MDL/网络问题让发布流程无限挂起。
  activeDeadlineSeconds: 900

  # 完成后 24h 自动清理：既能 `kubectl logs` 排障，又不让历史 Job 无限堆积。
  ttlSecondsAfterFinished: 86400

  template:
    metadata:
      labels:
        app.kubernetes.io/name: surgecart
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: surgecart
    spec:
      # 失败即退出，不在容器内反复重启；重试由 Job controller 负责（每次都是新 Pod）。
      restartPolicy: Never

      # 迁移不需要访问 Kubernetes API，也不依赖 Service 注入的环境变量。
      automountServiceAccountToken: false
      enableServiceLinks: false

      # 迁移进程无长连接、无在途请求，30s 足够完成连接关闭与锁释放（连接断开即释放锁）。
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: migrate
          # 必须替换为实际发布的不可变标签（CI 产出的短 SHA）。
          # 不使用 latest：迁移与回滚都需要可追溯的确切版本。
          image: docker.cnb.cool/framework-station/my-shop:REPLACE_WITH_COMMIT_SHA
          imagePullPolicy: IfNotPresent

          # 覆盖镜像 ENTRYPOINT（docker-entrypoint.sh 会再启动 serve），
          # 只执行迁移：不启动 HTTP Server / Redis / Kafka Consumer / Publisher / Scanner。
          command: ["/app/my-shop"]
          args: ["migrate", "up"]

          envFrom:
            - configMapRef:
                name: surgecart-migration-config
            - secretRef:
                name: surgecart-db-credentials

          env:
            # 显式重复一次，避免 ConfigMap 漏配时回退到「非严格」运行：
            # 环境变量优先级高于 ConfigMap，两者同时声明时以此为准。
            - name: DEPLOYMENT_REQUIRE_EXTERNAL_ENDPOINTS
              value: "true"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            # 只读根文件系统下唯一可写路径（Go 运行期临时文件）。
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
