# T2-05 数据库迁移 Job 的凭据载体（Secret 模板）。
#
# ⚠️ 本文件是模板，只允许存放占位符：
#   - 禁止把真实口令填入本文件后提交 Git；
#   - 禁止把口令写进 Dockerfile、镜像层、ConfigMap、Job 参数或日志；
#   - 生产环境应由 External Secrets / Sealed Secrets / CI 注入的同名 Secret 提供，
#     而不是 `kubectl apply -f` 本文件。
#
# 创建方式（口令只存在于本地 shell 历史之外的变量中）：
#   kubectl -n surgecart create secret generic surgecart-db-credentials \
#     --from-literal=DATABASE_DEFAULT_PASS="$DATABASE_DEFAULT_PASS"
#
# 与 ConfigMap 的分工见 docs/development/configuration.md §5。
apiVersion: v1
kind: Secret
metadata:
  name: surgecart-db-credentials
  namespace: surgecart
  labels:
    app.kubernetes.io/name: surgecart
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: surgecart
type: Opaque
stringData:
  # 占位符必须被替换后才能启动迁移；保持原样时 MySQL 认证失败（非零退出、不泄漏值）。
  DATABASE_DEFAULT_PASS: "REPLACE_WITH_DATABASE_PASSWORD"
