# Migration 基础层：只有迁移 Job。
#
# 该入口刻意不包含 Deployment / Service / PVC / Secret：迁移不启动 HTTP、Redis、Kafka、
# Publisher、Consumer 与 Scanner，也不读写业务文件，更不需要 JWT / 超管 / 七牛凭据。
#
# 它引用的 ConfigMap（surgecart-database-config）与 Secret（surgecart-db-credentials）
# 由 overlay 组合或由部署环境创建：Kustomize 构建产物中永远不出现 Secret 内容。
#
# 构建（不带发布版本后缀，用于本地检查或自建 overlay）：
#   kubectl kustomize manifest/kubernetes/migration/base
#
# 正式发布入口是 migration/overlays/production（共享配置 + 不可变 Job 名称 + 镜像版本）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - migration-job.yaml

namespace: surgecart
