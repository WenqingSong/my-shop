# Grafana 访问入口（T4-04）。
#
# 只提供 ClusterIP：
#   - 本任务不要求从集群外访问，NodePort/LoadBalancer/Ingress 会把监控控制台暴露到业务入口之外；
#   - 本机查看走 port-forward：
#       kubectl -n monitoring port-forward svc/grafana 3000:3000
#
# 注意：Grafana 查询 Prometheus 走服务端 DNS（见 configmap-datasource.yaml），
# port-forward 只影响人工访问，不影响数据源连通性。
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: surgecart
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
  ports:
    # 命名端口：Deployment 探针与 Service targetPort 共用 http。
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  sessionAffinity: None
