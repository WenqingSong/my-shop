# =============================================================================
# my-shop Nginx 反向代理（面向外部的唯一 HTTP 入口，V1）
#
# 职责边界（对应 APPROVED Contract D1~D10）：
#   - 纯反向代理，无 Lua/njs 业务逻辑，可被 Kubernetes Ingress 直接取代，不搭二次代理层；
#   - 单跳信任边界：覆盖式重写 X-Real-IP / X-Forwarded-For 为 $remote_addr，
#     丢弃客户端伪造的转发头，防止污染后端 r.GetClientIp()（其取 X-Forwarded-For 第一项）；
#   - 非幂等/任意方法均不自动重试（proxy_next_upstream off），「恰好一次」由业务层幂等保证；
#   - 上游 DNS 运行时再解析（resolver 127.0.0.11 + server resolve），
#     app 冷启动/重建/容器 IP 变化后 ~10s 内自动恢复（期间短暂 502，不重试）；
#   - 公共入口 /metrics 返回 404（Prometheus 经内部网络直连 app:8000/metrics）；
#   - /health 透传 app（公开最小探活），语义与 app 容器内 healthcheck 一致。
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 结构化访问日志（JSON，escape=json）：含 Request ID 与 upstream 响应耗时，
    # 用于与 Go 应用侧 request_id 关联。刻意不记录 Authorization / Cookie / 请求体等敏感信息。
    log_format main escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"http_user_agent":"$http_user_agent"}';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 不暴露 Nginx 版本（Server 响应头与默认错误页）。
    server_tokens   off;

    # 请求体大小上限（默认 1m）：现有 API 均为小 JSON，大文件上传走七牛直传凭证。
    client_max_body_size 1m;
    client_body_timeout  30s;

    # Docker 内嵌 DNS：upstream 运行时再解析依赖它。
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream my_shop_backend {
        # 共享内存区：server resolve 动态再解析必需。
        zone my_shop_backend 64k;
        # 运行时 DNS 再解析（需 nginx >= 1.27.3），app 重建后 IP 变化可自动恢复。
        server app:8000 resolve;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;

        # 安全响应头（always：错误页/4xx/5xx 也附带）。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # 公共入口 /metrics 不暴露（不转发；Prometheus 经 Compose 网络直连 app:8000/metrics）。
        location = /metrics {
            return 404;
        }

        # 反向代理主入口（/health 与所有业务 API 统一经此透传）。
        location / {
            proxy_pass http://my_shop_backend;
            # 与上游保持 HTTP/1.1 + keepalive 连接复用。
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 请求头契约：Request ID 由 Nginx 统一生成并覆盖客户端值；
            # 转发头覆盖为 $remote_addr，丢弃客户端伪造值（单跳信任边界）。
            proxy_set_header X-Request-ID    $request_id;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host            $host;

            # 代理/连接/发送/读取超时。
            proxy_connect_timeout 3s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # 关闭代理层自动重试：非幂等请求（秒杀下单/下单/支付）在上游连接失败或超时时
            # 绝不重试，避免代理引入的重复写入；「恰好执行一次」由业务层幂等机制保证。
            proxy_next_upstream off;
        }

        # 上游不可达（502）/ 超时（504）：返回通用最小错误响应，不暴露内部路径/堆栈/凭据/Nginx 版本。
        error_page 502 504 /50x.html;
        location = /50x.html {
            internal;
            root /etc/nginx/error;
        }

        # 请求体超限：返回 413，请求不转发到后端。
        error_page 413 /413.html;
        location = /413.html {
            internal;
            root /etc/nginx/error;
        }
    }
}
