# 通用参数组件（由 tools/openapi-gen 生成）。
PageStrictParam:
  name: page
  in: query
  required: false
  description: 页码，默认 1；<1 或非整数返回 HTTP 400 + code 1001。
  schema:
    type: integer
    format: int64
    minimum: 1
    default: 1
  x-pagination-mode: strict
SizeStrictParam:
  name: size
  in: query
  required: false
  description: 每页数量，默认 20，上限 100；越界或非整数返回 HTTP 400 + code 1001。
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 100
    default: 20
  x-pagination-mode: strict
PageClampParam:
  name: page
  in: query
  required: false
  description: 页码；<1 时静默归一为 1（历史行为，不返回 400）。
  schema:
    type: integer
    format: int64
    default: 1
  x-pagination-mode: clamp
SizeClampParam:
  name: size
  in: query
  required: false
  description: 每页数量；<1 归一为 20，>100 归一为 100（历史行为，不返回 400）。
  schema:
    type: integer
    format: int64
    default: 20
  x-pagination-mode: clamp
IdempotencyKeyHeader:
  name: Idempotency-Key
  in: header
  required: false
  description: 幂等键（目标规范，仅适用于新接口）。同一 key + 同一请求体在 TTL 内返回首次结果；同一 key + 不同请求体返回 409。现有订单/秒杀接口尚未支持该 Header，仍使用 JSON body 的 idempotency_key。
  schema:
    type: string
    minLength: 8
    maxLength: 128
