ReviewListResponse:
  type: object
  description: ListRes 商品公开评价列表与汇总响应（仅 published，按 id 倒序）。
  required:
    - items
    - page
    - size
    - total
    - avg_rating
    - count
  properties:
    items:
      type: array
      items:
        oneOf: [{$ref: '#/ReviewItem'}, {type: "null"}]
      description: 评价列表（仅 published）
    page:
      type: integer
      format: int64
      x-go-type: int
      description: 当前页码
    size:
      type: integer
      format: int64
      x-go-type: int
      description: 每页数量
    total:
      type: integer
      format: int64
      x-go-type: int
      description: 已发布评价总数
    avg_rating:
      type: number
      format: double
      x-go-type: float64
      description: 平均分（1 位小数）
    count:
      type: integer
      format: int64
      x-go-type: int
      description: 已发布评价条数
ReviewCreateRequest:
  type: object
  description: CreateReq 提交评价请求（仅登录用户，作用于 Principal.UserID）。 归属字段（user_id/product_id/sku_id）由服务端从 Principal 与订单项推导，不信任客户端提交。
  properties:
    order_item_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 订单项 id（必填，缺失或 ≤0 返回 400）
    rating:
      type: integer
      format: int64
      x-go-type: int
      description: 星级 1-5（越界返回 10004）
    content:
      type: string
      description: 评价内容（trim 后非空且 ≤500 字符）
ReviewCreateResponse:
  type: object
  description: CreateRes 提交评价响应。
  allOf:
    - $ref: '#/Review'
ReviewMyListRequest:
  type: object
  description: MyListReq 本人全部评价列表请求（仅登录用户，含全部状态）。
  properties:
    page:
      type: integer
      format: int64
      x-go-type: int
      description: 页码，默认 1
    size:
      type: integer
      format: int64
      x-go-type: int
      description: 每页数量，默认 20，最大 100
ReviewMyListResponse:
  type: object
  description: MyListRes 本人全部评价列表响应（含全部状态，按 id 倒序）。
  required:
    - items
    - total
    - page
    - size
  properties:
    items:
      type: array
      items:
        oneOf: [{$ref: '#/Review'}, {type: "null"}]
      description: 本人评价列表
    total:
      type: integer
      format: int64
      x-go-type: int
      description: 总数量
    page:
      type: integer
      format: int64
      x-go-type: int
      description: 当前页码
    size:
      type: integer
      format: int64
      x-go-type: int
      description: 每页数量
ReviewUpdateRequest:
  type: object
  description: UpdateReq 修改本人评价请求（仅本人且 status=published 可改）。
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      description: 评价 id
    rating:
      type: integer
      format: int64
      x-go-type: int
      description: 星级 1-5（越界返回 10004）
    content:
      type: string
      description: 评价内容（trim 后非空且 ≤500 字符）
ReviewUpdateResponse:
  type: object
  description: UpdateRes 修改本人评价响应。
  allOf:
    - $ref: '#/Review'
ReviewDeleteRequest:
  type: object
  description: DeleteReq 删除本人评价请求（仅本人，published → deleted 软删除）。
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      description: 评价 id
ReviewDeleteResponse:
  type: object
  description: DeleteRes 删除本人评价响应。
  allOf:
    - $ref: '#/Review'
ReviewTakeDownRequest:
  type: object
  description: TakeDownReq 下架违规评价请求（仅管理员，持 review:take_down，published → taken_down）。
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      description: 评价 id
ReviewTakeDownResponse:
  type: object
  description: TakeDownRes 下架违规评价响应。
  allOf:
    - $ref: '#/Review'
SkuSpecValue:
  type: object
  description: SkuSpecValue 是 SKU 的一个规格取值（SKU → 规格组/规格值反向展示）。
  required:
    - spec_id
    - spec_name
    - spec_value_id
    - value
    - sort
  properties:
    spec_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 规格组 id
    spec_name:
      type: string
      description: 规格组名（如「颜色」）
    spec_value_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 规格值 id
    value:
      type: string
      description: 规格值文本（如「红色」）
    sort:
      type: integer
      format: int64
      x-go-type: int
      description: 规格组排序值（升序展示）
Sku:
  type: object
  description: Sku 商品 SKU 结构，前台/后台商品详情内嵌复用。
  required:
    - id
    - sku_code
    - product_id
    - name
    - image_url
    - price
    - original_price
    - status
    - spec_key
    - spec_values
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      description: SKU id（稳定引用键，不重用）
    sku_code:
      type: string
      description: SKU 业务唯一编码（下单按它定位 SKU）
    product_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 所属商品 id
    name:
      type: string
      description: SKU 名称
    image_url:
      type: string
      description: SKU 规格图 URL；空表示回退商品主图
    price:
      type: integer
      format: int64
      x-go-type: int64
      x-unit: cent
      description: 售价（整数分，下单定价唯一来源）
    original_price:
      type: integer
      format: int64
      x-go-type: int64
      x-unit: cent
      description: 原价/划线价（整数分）
    status:
      type: string
      enum: [enabled, disabled]
      x-enum-labels:
        enabled: 启用
        disabled: 禁用
      description: 状态：enabled/disabled
    spec_key:
      type: string
      description: 规格组合指纹（MD5，32 位小写 hex；无规格为空串）
    spec_values:
      type: array
      items:
        oneOf: [{$ref: '#/SkuSpecValue'}, {type: "null"}]
      description: 规格取值列表（按规格组 sort 升序；无规格为空数组）
    created_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 创建时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    updated_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 更新时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
SkuCreateRequest:
  type: object
  description: CreateReq 创建 SKU 请求（product_id 在请求体，指向必须存在的商品）。 sku_code 由服务端生成，不接受客户端指定；无规格 SKU 使用本接口创建。
  required:
    - product_id
    - name
    - price
  properties:
    product_id:
      type: integer
      format: int64
      x-go-type: int64
      x-go-validate: required
      description: 所属商品 id（必须存在）
    name:
      type: string
      x-go-validate: required
      description: SKU 名称，非空且不超过 128 字符
    image_url:
      type: string
      description: SKU 规格图 URL，可选，不超过 512 字符
    price:
      oneOf: [{type: integer, format: int64}, {type: string, pattern: '^-?[0-9]+$'}]
      x-go-type: json.Number
      x-go-validate: required
      description: 售价（整数分，0~99999999）；接受 JSON 整数或数字字符串（GoFrame 绑定行为）
    original_price:
      oneOf: [{type: integer, format: int64}, {type: string, pattern: '^-?[0-9]+$'}]
      x-go-type: json.Number
      description: 原价/划线价（整数分，0~99999999）；缺省等于售价；接受 JSON 整数或数字字符串（GoFrame 绑定行为）
    status:
      type: [string, "null"]
      enum: [enabled, disabled, null]
      x-enum-labels:
        enabled: 启用
        disabled: 禁用
      description: 状态：enabled/disabled，默认 enabled
SkuCreateResponse:
  type: object
  description: CreateRes 创建 SKU 响应。
  allOf:
    - $ref: '#/Sku'
SkuUpdateRequest:
  type: object
  description: UpdateReq 更新 SKU 请求（product_id 不可变）。
  required:
    - id
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      x-go-validate: required
      description: SKU id
    name:
      type: [string, "null"]
      description: SKU 名称，非空且不超过 128 字符
    image_url:
      type: [string, "null"]
      description: SKU 规格图 URL，不超过 512 字符
    price:
      oneOf: [{type: integer, format: int64}, {type: string, pattern: '^-?[0-9]+$'}]
      x-go-type: json.Number
      description: 售价（整数分，0~99999999）；接受 JSON 整数或数字字符串（GoFrame 绑定行为）
    original_price:
      oneOf: [{type: integer, format: int64}, {type: string, pattern: '^-?[0-9]+$'}]
      x-go-type: json.Number
      description: 原价/划线价（整数分，0~99999999）；接受 JSON 整数或数字字符串（GoFrame 绑定行为）
    status:
      type: [string, "null"]
      enum: [enabled, disabled, null]
      x-enum-labels:
        enabled: 启用
        disabled: 禁用
      description: 状态：enabled/disabled
SkuUpdateResponse:
  type: object
  description: UpdateRes 更新 SKU 响应。
  allOf:
    - $ref: '#/Sku'
SkuDeleteRequest:
  type: object
  description: DeleteReq 删除 SKU 请求（物理删除）。
  required:
    - id
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      x-go-validate: required
      description: SKU id
SkuDeleteResponse:
  type: object
  description: DeleteRes 删除 SKU 响应（无业务字段）。
  properties: {}
  additionalProperties: false
SkuGenerateRequest:
  type: object
  description: GenerateReq 按商品规格组与规格值生成 SKU 组合请求。 组合由服务端按商品规格组的笛卡尔积生成；已存在的组合（同商品同 spec_key）保留原 SKU 与 sku_code，不覆盖其价格/状态/图片。price 等默认值仅用于本次新建的 SKU。
  required:
    - id
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      x-go-validate: required
      description: 商品 id
    price:
      oneOf: [{type: integer, format: int64}, {type: string, pattern: '^-?[0-9]+$'}]
      x-go-type: json.Number
      description: 新建 SKU 的售价（整数分）；缺省取商品价格；接受 JSON 整数或数字字符串（GoFrame 绑定行为）
    original_price:
      oneOf: [{type: integer, format: int64}, {type: string, pattern: '^-?[0-9]+$'}]
      x-go-type: json.Number
      description: 新建 SKU 的原价（整数分）；缺省等于售价；接受 JSON 整数或数字字符串（GoFrame 绑定行为）
    image_url:
      type: string
      description: 新建 SKU 的规格图 URL，可选
    status:
      type: [string, "null"]
      description: 新建 SKU 的状态，默认 enabled
SkuGenerateResponse:
  type: object
  description: GenerateRes 生成 SKU 组合响应（items 为该商品全部 SKU，含本次保留的既有 SKU）。
  required:
    - created
    - kept
    - items
  properties:
    created:
      type: integer
      format: int64
      x-go-type: int
      description: 本次新建的 SKU 数量
    kept:
      type: integer
      format: int64
      x-go-type: int
      description: 已存在而保留（未改动）的 SKU 数量
    items:
      type: array
      items:
        oneOf: [{$ref: '#/Sku'}, {type: "null"}]
      description: 该商品全部 SKU（按 id 升序）
SpecValue:
