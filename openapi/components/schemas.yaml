Address:
  type: object
  description: Address 收货地址结构，创建/查询/更新复用。
  required:
    - id
    - recipient_name
    - phone
    - province
    - city
    - district
    - detail
    - is_default
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      description: 地址 id
    recipient_name:
      type: string
      description: 收货人姓名
    phone:
      type: string
      description: 手机号
    province:
      type: string
      description: 省（自由文本）
    city:
      type: string
      description: 市（自由文本）
    district:
      type: string
      description: 区（自由文本）
    detail:
      type: string
      description: 详细地址
    is_default:
      type: boolean
      description: 是否默认地址
    created_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 创建时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    updated_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 更新时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
AddressCreateRequest:
  type: object
  description: CreateReq 创建地址请求。请求体不含也不接受 user_id，归属取自已认证 Principal。
  properties:
    recipient_name:
