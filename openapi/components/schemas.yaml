OrderCreateRequest:
  type: object
  description: CreateReq 创建订单请求（source=cart 时从购物车勾选项下单，忽略 sku_id/quantity； source=direct 时按单个 SKU + 数量直接购买）。
  required:
    - source
    - address_id
    - idempotency_key
  properties:
    source:
      type: string
      enum: [cart, direct]
      x-enum-labels:
        cart: 购物车勾选下单
        direct: 单 SKU 直接购买
      x-go-validate: required
      description: 来源：cart/direct
    address_id:
      type: integer
      format: int64
      x-go-type: int64
      x-go-validate: required
      description: 收货地址 id（必须属于当前用户）
    idempotency_key:
      type: string
      x-go-validate: required
      description: 幂等键（同键同内容幂等，同键不同内容 9006）
    sku_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 直接购买 SKU id（source=direct 必填）
    quantity:
      type: integer
