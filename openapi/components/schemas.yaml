SpecDeleteValueResponse:
  type: object
  description: DeleteValueRes 删除规格值响应（无业务字段）。
  properties: {}
  additionalProperties: false
UploadFrontendTokenRequest:
  type: object
  description: FrontendTokenReq 前台签发七牛云上传凭证请求（Auth：登录用户）。 filename 与 content_type 均可选：filename 含扩展名，用于扩展名预校验与生成 key； content_type 为客户端声明 MIME，用于预校验。大小上限固化进 token 的 fsizeLimit 由七牛服务端执行。
  properties:
    filename:
      type: string
      description: 文件名（含扩展名，可选）
    content_type:
      type: string
      description: 客户端声明 MIME 类型（可选）
UploadAdminTokenRequest:
  type: object
  description: AdminTokenReq 后台签发七牛云上传凭证请求（AdminAuth：管理员）。
  properties:
    filename:
      type: string
      description: 文件名（含扩展名，可选）
    content_type:
      type: string
      description: 客户端声明 MIME 类型（可选）
UploadTokenResponse:
  type: object
  description: TokenRes 上传凭证响应：客户端用 token 向 upload_url 直传文件，上传成功后访问 final_url。
  required:
    - token
    - key
    - upload_url
    - domain
    - final_url
    - expires_at
  properties:
    token:
      type: string
      description: 七牛云上传凭证（客户端直传用）
    key:
      type: string
      description: 后端预生成的存储 key（写入 token scope）
    upload_url:
      type: string
      description: 上传主机（按 region 映射）
    domain:
      type: string
      description: 对外访问域名
    final_url:
      type: string
      description: 上传成功后可直接访问的地址（domain/key）
    expires_at:
      type: integer
      format: int64
      x-go-type: int64
      description: 凭证过期时间（unix 秒）
WalletAccountRequest:
  type: object
  description: AccountReq 查询本人钱包余额。
  properties: {}
  additionalProperties: false
WalletAccountResponse:
  type: object
  description: AccountRes 钱包余额响应（不含内部账户 id 与归属用户 id）。
  required:
    - balance
    - updated_at
  properties:
    balance:
      type: integer
      format: int64
      x-go-type: int64
      description: 可用余额（整数分）
    updated_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 账户记录最后更新时间（初始化或余额变更触发）；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
WalletTransaction:
  type: object
  description: Transaction 资金流水（append-only，只读）。
  required:
    - id
    - tx_type
    - direction
    - amount
    - balance_before
    - balance_after
    - biz_type
    - biz_id
    - remark
    - created_at
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      description: 流水 id
    tx_type:
      type: string
      description: 交易类型：recharge/order_pay/order_refund
    direction:
      type: string
      description: 交易方向：credit=入账、debit=出账
    amount:
      type: integer
      format: int64
      x-go-type: int64
      x-unit: cent
      description: 交易金额（整数分，恒为正数）
    balance_before:
      type: integer
      format: int64
      x-go-type: int64
      description: 交易前余额（整数分）
    balance_after:
      type: integer
      format: int64
      x-go-type: int64
      description: 交易后余额（整数分）
    biz_type:
      type: string
      description: 业务类型：recharge/order/refund
    biz_id:
      type: [integer, "null"]
      format: int64
      x-go-type: int64
      description: 业务关联 id（充值单/订单/退款申请 id，可空）
    remark:
      type: string
      description: 备注
    created_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 创建时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
WalletTransactionListRequest:
  type: object
  description: TransactionListReq 查询本人资金流水请求（按创建时间倒序）。
  properties:
    page:
      type: [integer, "null"]
      format: int64
      x-go-type: int
      description: 页码，默认 1；<1 返回 400
    size:
      type: [integer, "null"]
      format: int64
      x-go-type: int
      description: 每页数量，默认 20、上限 100；越界返回 400
    tx_type:
      type: string
      description: 按交易类型筛选：recharge/order_pay/order_refund；缺省为不过滤
WalletTransactionListResponse:
  type: object
  description: TransactionListRes 资金流水分页响应。
  required:
    - items
    - total
    - page
    - size
  properties:
    items:
      type: array
      items:
        oneOf: [{$ref: '#/WalletTransaction'}, {type: "null"}]
      description: 资金流水列表（按 id 倒序，仅本人）
    total:
      type: integer
      format: int64
      x-go-type: int
      description: 总记录数
    page:
      type: integer
      format: int64
      x-go-type: int
      description: 当前页码
    size:
      type: integer
      format: int64
      x-go-type: int
      description: 每页数量
WalletRechargeRequest:
  type: object
  description: RechargeReq Mock 充值请求（仅登录用户，作用于 Principal.UserID）。 IdempotencyKey 是充值幂等键：同一用户重复提交同一键只会产生一笔充值单、只入账一次； 同键不同金额返回 21008（幂等冲突），不会被当作成功。
  required:
    - amount
    - idempotency_key
  properties:
    amount:
      type: integer
      format: int64
      x-go-type: int64
      x-unit: cent
      x-go-validate: required
      description: 充值金额（整数分，1 ~ 1000000）
    idempotency_key:
      type: string
      x-go-validate: required
      description: 充值幂等键（同键同金额幂等，同键不同金额 21008）
WalletRechargeOrder:
  type: object
  description: RechargeOrder Mock 充值订单（出参）。
  required:
    - id
    - order_no
    - amount
    - status
    - pay_type
    - paid_at
    - created_at
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      description: 充值单 id
    order_no:
      type: string
      description: 充值单号（全局唯一）
    amount:
      type: integer
      format: int64
      x-go-type: int64
      x-unit: cent
      description: 充值金额（整数分）
    status:
      type: string
      description: 状态：pending/succeeded/cancelled/failed
    pay_type:
      type: string
      description: 支付方式（Mock 固定 mock；未支付为空串）
    paid_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 支付完成时间（仅 succeeded 有值）；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    created_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 创建时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
WalletRechargeResponse:
  type: object
  description: RechargeRes Mock 充值响应。
  allOf:
    - $ref: '#/WalletRechargeOrder'
Success:
  type: object
  description: 统一成功响应包装：{code:0, message:"OK", data:<业务数据>}。data 的具体 Schema 由各 operation 的 allOf 覆盖；data 为 null 时表示该操作无返回体。
  required:
    - code
    - message
    - data
  properties:
    code:
      type: integer
      const: 0
      description: 业务码，成功恒为 0
    message:
      type: string
      const: OK
      description: 成功文案，恒为 OK
    data:
      description: 业务数据；类型由具体 operation 指定，可为 null
Error:
  type: object
  description: 统一失败响应：{code:<业务错误码>, message:<码表文案>, data:null}。客户端必须以 code 判定错误类型，不得依赖 message 文本。
  required:
    - code
    - message
    - data
  properties:
    code:
      type: integer
      minimum: 1
      description: 业务错误码；完整注册表见 components/error-codes.yaml
    message:
      type: string
      description: 码表固定文案，不拼接字段细节
    data:
      type: "null"
      description: 失败时恒为 null
