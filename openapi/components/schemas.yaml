      type: string
      enum: [applying, pending_refund, refund_failed, review_rejected, revoked, refund_succeeded, closed]
      x-enum-labels:
        applying: 申请中（DB 10）
        pending_refund: 待退款（DB 20）
        refund_failed: 退款失败（DB 30）
        review_rejected: 审核拒绝（DB 40，终态）
        revoked: 已撤销（DB 50，终态）
        refund_succeeded: 退款成功（DB 60，终态）
        closed: 已关闭（DB 70，终态）
