    id:
      type: integer
      format: int64
      x-go-type: int64
      description: 订单 id
    order_no:
      type: string
      description: 全局唯一秒杀订单号
    user_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 归属用户 id
    activity_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 活动 id（软引用）
    sku_id:
      type: integer
      format: int64
      x-go-type: int64
      description: SKU id（软引用）
    product_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 商品 id（软引用）
    sku_name:
      type: string
      description: SKU 名称快照
    product_name:
      type: string
      description: 商品名快照
    product_main_image:
      type: string
      description: 商品主图快照
    flash_price:
      type: integer
      format: int64
      x-go-type: int64
      x-unit: cent
