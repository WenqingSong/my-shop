    amount:
      type: integer
      format: int64
      x-go-type: int64
      x-unit: cent
      description: 退款金额（整数分，= 订单 total_amount 快照，服务端派生）
    reason:
      type: string
      description: 申请原因
    review_reason:
      type: string
      description: 审核原因
    reviewed_by:
      type: [integer, "null"]
      format: int64
      x-go-type: int64
      description: 审核管理员 id（可空）
