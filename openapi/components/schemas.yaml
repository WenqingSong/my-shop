    quantity:
      type: integer
      format: int64
      x-go-type: int64
      description: 数量（V1 恒为 1）
    idempotency_key:
      type: string
      description: 幂等键
    created_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 创建时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    updated_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 更新时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
FlashSaleActivitySkuInput:
  type: object
  description: ActivitySkuInput 创建/更新活动时的 SKU 绑定输入。 字段由 service 显式校验（不依赖 gvalid），避免非业务 gcode 透出为 500。
  required:
    - sku_id
    - flash_price
    - total_stock
  properties:
    sku_id:
      type: integer
      format: int64
      x-go-type: int64
      description: SKU id（必须存在）
    flash_price:
      oneOf: [{type: integer, format: int64}, {type: string, pattern: '^-?[0-9]+$'}]
      x-go-type: json.Number
      description: 秒杀价（整数分，>0 且 ≤99999999）；接受 JSON 整数或数字字符串（GoFrame 绑定行为）
    total_stock:
      type: integer
      format: int64
      x-go-type: int64
      description: 秒杀库存（正整数）
FlashSaleCreateRequest:
  type: object
  description: CreateReq 创建秒杀活动请求（后台，需 flash_sale:create）。
  properties:
    name:
      type: string
      description: 活动名，trim 后 1~64 字符
    start_time:
      type: [string, "null"]
      x-go-type: gtime.Time
      x-format: gtime-lenient
      description: 开始时间（必须早于结束时间）；请求侧为宽松解析：支持 YYYY-MM-DD HH:MM:SS、YYYY-MM-DD、RFC3339 等格式，无偏移值按服务端时区解释
    end_time:
      type: [string, "null"]
      x-go-type: gtime.Time
      x-format: gtime-lenient
      description: 结束时间；请求侧为宽松解析：支持 YYYY-MM-DD HH:MM:SS、YYYY-MM-DD、RFC3339 等格式，无偏移值按服务端时区解释
    skus:
      type: array
      items:
        oneOf: [{$ref: '#/FlashSaleActivitySkuInput'}, {type: "null"}]
      description: SKU 绑定列表（非空）
FlashSaleCreateResponse:
  type: object
  description: CreateRes 创建秒杀活动响应。
  allOf:
    - $ref: '#/FlashSaleActivity'
FlashSaleUpdateRequest:
  type: object
  description: UpdateReq 更新秒杀活动请求（后台，需 flash_sale:update；未提交字段保持不变）。
