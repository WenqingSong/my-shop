      format: int64
      x-go-type: int64
      description: 当前库存（无记录为 0）；SKU 被删除时为 null
    insufficient:
      type: boolean
      description: 是否库存不足（quantity > stock）
    created_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
