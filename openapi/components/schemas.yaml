OrderCreateRequest:
  type: object
  description: CreateReq 创建订单请求（source=cart 时从购物车勾选项下单，忽略 sku_id/sku_code/quantity； source=direct 时按单个 SKU（sku_code 优先，兼容 sku_id）+ 数量直接购买）。 单价一律由服务端按 skus.price 确定；price 字段仅用于检测客户端伪造/篡改价格， 与服务端定价不一致时拒绝下单，不参与任何金额计算。
  required:
    - source
    - address_id
    - idempotency_key
  properties:
    source:
      type: string
      enum: [cart, direct]
      x-enum-labels:
        cart: 购物车勾选下单
        direct: 单 SKU 直接购买
      x-go-validate: required
      description: 来源：cart/direct
    address_id:
      type: integer
      format: int64
      x-go-type: int64
      x-go-validate: required
      description: 收货地址 id（必须属于当前用户）
    idempotency_key:
      type: string
      x-go-validate: required
      description: 幂等键（同键同内容幂等，同键不同内容 9006）
    sku_code:
      type: string
      description: 直接购买 SKU 编码（source=direct 推荐；与 sku_id 至少填一个）
    sku_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 直接购买 SKU id（source=direct 兼容字段；与 sku_code 二选一或同时一致）
    quantity:
      type: integer
      format: int64
      x-go-type: int64
      description: 直接购买数量（source=direct 必填，正整数）
    coupon_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 可选使用的用户券 id（一笔订单最多一张，0 或缺省表示不使用）
    price:
      oneOf: [{type: integer, format: int64}, {type: string, pattern: '^-?[0-9]+$'}]
      x-go-type: json.Number
      description: 客户端单价（仅用于防伪校验）：必须等于服务端 skus.price，否则 9007 拒绝；接受 JSON 整数或数字字符串（GoFrame 绑定行为）
