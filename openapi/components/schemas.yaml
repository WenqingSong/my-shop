  description: Refund 退款申请（查询与写接口复用）。
  required:
    - id
    - order_id
    - user_id
    - status
    - amount
    - reason
    - review_reason
    - reviewed_by
    - reviewed_at
    - execute_reason
    - executed_by
    - executed_at
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
