Refund:
  type: object
  description: Refund 退款申请（查询与写接口复用）。
  required:
    - id
    - order_id
    - user_id
    - status
    - amount
    - reason
    - review_reason
    - reviewed_by
    - reviewed_at
    - execute_reason
    - executed_by
    - executed_at
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      description: 退款申请 id
    order_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 订单 id（软引用）
    user_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 申请者（订单所有者）id
    status:
      type: string
      enum: [applying, pending_refund, refund_failed, review_rejected, revoked, refund_succeeded, closed]
      x-enum-labels:
        applying: 申请中（DB 10）
        pending_refund: 待退款（DB 20）
        refund_failed: 退款失败（DB 30）
        review_rejected: 审核拒绝（DB 40，终态）
        revoked: 已撤销（DB 50，终态）
        refund_succeeded: 退款成功（DB 60，终态）
        closed: 已关闭（DB 70，终态）
      description: 状态：applying/pending_refund/refund_failed/review_rejected/revoked/refund_succeeded/closed
    amount:
      type: integer
      format: int64
      x-go-type: int64
      x-unit: cent
      description: 退款金额（整数分，= 订单 total_amount 快照，服务端派生）
    reason:
      type: string
      description: 申请原因
    review_reason:
      type: string
      description: 审核原因
    reviewed_by:
      type: [integer, "null"]
      format: int64
      x-go-type: int64
      description: 审核管理员 id（可空）
    reviewed_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 审核时间（可空）；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    execute_reason:
      type: string
      description: 执行/关闭原因
    executed_by:
      type: [integer, "null"]
      format: int64
      x-go-type: int64
      description: 执行/关闭管理员 id（可空）
    executed_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 执行/关闭时间（可空）；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    created_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 创建时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    updated_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 更新时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
