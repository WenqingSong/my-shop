  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      x-go-validate: required
      description: 活动 id
    name:
      type: [string, "null"]
      description: 活动名
    status:
      type: [string, "null"]
      description: 状态：enabled/disabled
    start_time:
      type: [string, "null"]
      x-go-type: gtime.Time
      x-format: gtime-lenient
      description: 开始时间；请求侧为宽松解析：支持 YYYY-MM-DD HH:MM:SS、YYYY-MM-DD、RFC3339 等格式，无偏移值按服务端时区解释
    end_time:
      type: [string, "null"]
      x-go-type: gtime.Time
      x-format: gtime-lenient
      description: 结束时间；请求侧为宽松解析：支持 YYYY-MM-DD HH:MM:SS、YYYY-MM-DD、RFC3339 等格式，无偏移值按服务端时区解释
    skus:
