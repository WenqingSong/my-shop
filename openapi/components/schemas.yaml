    sku_name:
      type: string
      description: SKU 名；SKU 被删除时为空
    current_price:
      type: [integer, "null"]
      format: int64
      x-go-type: int64
      x-unit: cent
      description: 当前 SKU 价格；SKU 被删除时为 null
