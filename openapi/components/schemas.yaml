  description: RemoveReq 取消收藏请求（按 product_id 幂等，未收藏/不存在也成功）。
  required:
    - product_id
  properties:
    product_id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      x-go-validate: required
      description: 商品 id
FavoriteRemoveResponse:
  type: object
  description: RemoveRes 取消收藏响应（无业务字段）。
  properties: {}
  additionalProperties: false
FavoriteListRequest:
  type: object
  description: ListReq 收藏列表请求（分页，仅登录用户本人收藏）。
  properties:
    page:
      type: integer
      format: int64
      x-go-type: int
      description: 页码，默认 1
    size:
      type: integer
      format: int64
      x-go-type: int
      description: 每页数量，默认 20，最大 100
FavoriteListResponse:
  type: object
  description: ListRes 收藏列表响应（按收藏时间倒序）。
  required:
    - items
    - total
    - page
    - size
  properties:
    items:
      type: array
      items:
        oneOf: [{$ref: '#/FavoriteItem'}, {type: "null"}]
      description: 收藏列表
    total:
      type: integer
      format: int64
      x-go-type: int
      description: 总数量
    page:
      type: integer
      format: int64
      x-go-type: int
      description: 当前页码
    size:
      type: integer
      format: int64
      x-go-type: int
      description: 每页数量
FavoriteCheckRequest:
  type: object
  description: CheckReq 是否已收藏请求（独立鉴权查询，供商品详情展示收藏态）。
  properties:
    product_id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: query
      description: 商品 id（必填，缺失或 ≤0 返回 400）
FavoriteCheckResponse:
  type: object
  description: CheckRes 是否已收藏响应。
  required:
    - favorited
  properties:
    favorited:
      type: boolean
      description: 当前用户是否已收藏该商品
FlashSaleActivitySku:
  type: object
  description: ActivitySku 秒杀活动 × SKU 绑定（秒杀价 + 秒杀库存）。
  required:
    - id
    - sku_id
    - flash_price
    - total_stock
    - sold
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      description: 绑定 id
    sku_id:
      type: integer
      format: int64
      x-go-type: int64
      description: SKU id（软引用）
    flash_price:
      type: integer
      format: int64
      x-go-type: int64
      x-unit: cent
      description: 秒杀价（整数分）
    total_stock:
      type: integer
      format: int64
      x-go-type: int64
      description: 秒杀初始库存
    sold:
      type: integer
      format: int64
      x-go-type: int64
      description: 已售数量
FlashSaleActivity:
  type: object
  description: Activity 秒杀活动（含 SKU 绑定列表）。
  required:
    - id
    - name
    - status
    - start_time
    - end_time
    - skus
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      description: 活动 id
    name:
      type: string
      description: 活动名
    status:
      type: string
      enum: [enabled, disabled]
      x-enum-labels:
        enabled: 启用
        disabled: 禁用
      description: 状态：enabled/disabled
    start_time:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 开始时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    end_time:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 结束时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    skus:
      type: array
      items:
        oneOf: [{$ref: '#/FlashSaleActivitySku'}, {type: "null"}]
      description: SKU 绑定列表
    created_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 创建时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    updated_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 更新时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
FlashSaleOrder:
  type: object
