    phone:
      type: string
      description: 手机号，格式 ^1[3-9]\d{9}$
    province:
      type: string
      description: 省（自由文本；提供 region_id 时可省略，服务端以字典为准）
    city:
      type: string
      description: 市（自由文本；提供 region_id 时可省略，服务端以字典为准）
    district:
      type: string
      description: 区（自由文本；提供 region_id 时可省略，服务端以字典为准）
    region_id:
      type: [integer, "null"]
      format: int64
      x-go-type: int64
      description: 结构化地区 id（区/县级，regions.level=3）；提供时省/市/区文本由字典填充
    detail:
      type: string
      description: 详细地址，trim 后 1~255 字符
    is_default:
      type: [boolean, "null"]
      description: 是否默认地址；首条地址忽略此值自动置为默认
