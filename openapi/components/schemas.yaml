  description: LogoutReq 登出当前会话请求。sid 来自当前 token，不接受客户端指定。
  properties: {}
  additionalProperties: false
UserLogoutResponse:
  type: object
  description: LogoutRes 登出当前会话响应（无业务字段，成功时 data 为 null）。
  properties: {}
  additionalProperties: false
UserSession:
  type: object
  description: Session 会话条目（会话列表项）。
  required:
    - sid
    - login_at
    - user_agent
    - ip
    - current
  properties:
    sid:
      type: string
      description: 会话标识
    login_at:
      type: integer
      format: int64
      x-go-type: int64
      description: 登录时间（unix 秒）
    user_agent:
      type: string
      description: 客户端 User-Agent
    ip:
      type: string
      description: 客户端 IP
    current:
      type: boolean
      description: 是否为当前会话
UserListSessionsRequest:
  type: object
  description: ListSessionsReq 会话列表请求。
  properties: {}
  additionalProperties: false
UserListSessionsResponse:
  type: object
  description: ListSessionsRes 会话列表响应。
  required:
    - items
  properties:
    items:
      type: array
      items:
        oneOf: [{$ref: '#/UserSession'}, {type: "null"}]
      description: 会话列表
UserRevokeSessionRequest:
  type: object
  description: RevokeSessionReq 撤销指定会话请求。目标 sid 来自 URL 路径，不接受请求体指定。
  properties:
    sid:
      type: string
      x-in: path
      description: 目标会话标识
UserRevokeSessionResponse:
  type: object
  description: RevokeSessionRes 撤销指定会话响应（无业务字段，成功时 data 为 null）。
  properties: {}
  additionalProperties: false
UserRevokeOthersRequest:
  type: object
  description: RevokeOthersReq 撤销其他会话请求。
  properties: {}
  additionalProperties: false
UserRevokeOthersResponse:
  type: object
  description: RevokeOthersRes 撤销其他会话响应（无业务字段，成功时 data 为 null）。
  properties: {}
  additionalProperties: false
UserRevokeAllRequest:
  type: object
  description: RevokeAllReq 全部退出请求。
  properties: {}
  additionalProperties: false
UserRevokeAllResponse:
  type: object
  description: RevokeAllRes 全部退出响应（无业务字段，成功时 data 为 null）。
  properties: {}
  additionalProperties: false
UserGetUserStatusRequest:
  type: object
  description: GetUserStatusReq 查询用户账号状态请求（后台域，AdminAuth + RequirePermission("user:read")）。 目标用户 id 来自 URL 路径，服务端不信任请求体身份。
  required:
    - id
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      x-go-validate: required
      description: 目标用户 id
UserGetUserStatusResponse:
  type: object
  description: GetUserStatusRes 查询用户账号状态响应。
  required:
    - id
    - status
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      description: 用户 id
    status:
      type: integer
      format: int64
      x-go-type: int
      enum: [0, 1]
      x-enum-labels:
        "0": 禁用
        "1": 启用
      description: 1 启用 / 0 禁用
UserUpdateUserStatusRequest:
  type: object
  description: UpdateUserStatusReq 禁用/启用用户请求（后台域，AdminAuth + RequirePermission("user:status")）。 目标用户 id 来自 URL 路径；reason 必填（trim 后非空、≤255）。
  required:
    - id
    - status
    - reason
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      x-go-validate: required
      description: 目标用户 id
    status:
      type: integer
      format: int64
      x-go-type: int
      enum: [0, 1]
      x-enum-labels:
        "0": 禁用
        "1": 启用
      x-go-validate: required|in:0,1
      description: 1 启用 / 0 禁用
    reason:
      type: string
      x-go-validate: required
      description: 变更原因，非空且不超过 255 字符
UserUpdateUserStatusResponse:
  type: object
  description: UpdateUserStatusRes 禁用/启用用户响应（无业务字段，成功时 data 为 null）。
  properties: {}
  additionalProperties: false
Inventory:
  type: object
  description: Inventory 库存结构，查询与写接口复用。
  required:
    - sku_id
    - quantity
    - created_at
    - updated_at
  properties:
    sku_id:
      type: integer
      format: int64
      x-go-type: int64
      description: SKU id
    quantity:
      type: integer
      format: int64
      x-go-type: int64
      description: 当前库存数量（无记录时为 0）
    created_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 创建时间（无记录时为 null）；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    updated_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 更新时间（无记录时为 null）；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
InventoryLog:
  type: object
  description: Log 库存变更流水记录。
  required:
    - id
    - sku_id
    - change_type
    - change_qty
    - before_qty
    - after_qty
    - operator_admin_id
    - reason
    - created_at
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      description: 流水 id
    sku_id:
      type: integer
      format: int64
      x-go-type: int64
      description: SKU id
    change_type:
      type: string
      enum: [increase, deduct]
      x-enum-labels:
        increase: 增加
        deduct: 扣减
      description: 变更类型：increase/deduct
    change_qty:
      type: integer
      format: int64
      x-go-type: int64
      description: 变更量（正数）
    before_qty:
      type: integer
      format: int64
      x-go-type: int64
      description: 变更前库存
    after_qty:
      type: integer
      format: int64
      x-go-type: int64
      description: 变更后库存
    operator_admin_id:
      type: [integer, "null"]
      format: int64
      x-go-type: int64
      description: 操作者管理员 id（可空）
    reason:
      type: string
      description: 变更原因
    created_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 变更时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
InventoryGetRequest:
  type: object
  description: GetReq 查询库存请求。
  required:
    - sku_id
  properties:
    sku_id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      x-go-validate: required
      description: SKU id
InventoryGetResponse:
  type: object
  description: GetRes 查询库存响应（无记录 = 0）。
  allOf:
    - $ref: '#/Inventory'
InventoryIncreaseRequest:
  type: object
  description: IncreaseReq 增加库存请求（兼作首次初始化）。
  required:
    - sku_id
  properties:
    sku_id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      x-go-validate: required
      description: SKU id
    quantity:
      oneOf: [{type: integer, format: int64}, {type: string, pattern: '^-?[0-9]+$'}]
      x-go-type: json.Number
      description: 增加数量（正整数）；接受 JSON 整数或数字字符串（GoFrame 绑定行为）
InventoryIncreaseResponse:
  type: object
  description: IncreaseRes 增加库存响应。
  allOf:
    - $ref: '#/Inventory'
InventoryDeductRequest:
  type: object
  description: DeductReq 条件扣减库存请求（库存充足才成功）。
  required:
    - sku_id
  properties:
    sku_id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      x-go-validate: required
      description: SKU id
    quantity:
      oneOf: [{type: integer, format: int64}, {type: string, pattern: '^-?[0-9]+$'}]
      x-go-type: json.Number
      description: 扣减数量（正整数）；接受 JSON 整数或数字字符串（GoFrame 绑定行为）
InventoryDeductResponse:
  type: object
  description: DeductRes 扣减库存响应。
  allOf:
    - $ref: '#/Inventory'
InventoryListLogsRequest:
  type: object
  description: ListLogsReq 查询库存流水请求（分页，id 倒序）。
  required:
    - sku_id
  properties:
    sku_id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      x-go-validate: required
      description: SKU id
    page:
      type: integer
      format: int64
      x-go-type: int
      x-in: query
      default: 1
      description: 页码，默认 1
    size:
      type: integer
      format: int64
      x-go-type: int
      x-in: query
      default: 20
      description: 每页条数，默认 20，最大 100
InventoryListLogsResponse:
  type: object
  description: ListLogsRes 库存流水响应（id 倒序，分页）。
  required:
    - items
    - total
    - page
    - size
  properties:
    items:
      type: array
      items:
        oneOf: [{$ref: '#/InventoryLog'}, {type: "null"}]
      description: 当前页流水（id 倒序）
    total:
      type: integer
      format: int64
      x-go-type: int
      description: 符合条件的流水总数
    page:
      type: integer
      format: int64
      x-go-type: int
      description: 生效页码
    size:
      type: integer
      format: int64
      x-go-type: int
      description: 生效每页条数
LikeLikeRequest:
  type: object
  description: LikeReq 点赞请求（仅登录用户，作用于 Principal.UserID；重复点赞幂等成功）。
  properties:
    product_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 商品 id（必填，缺失或 ≤0 返回 400）
LikeLikeResponse:
  type: object
  description: LikeRes 点赞响应（点赞后本人对商品必为已点赞）。
  required:
    - liked
  properties:
    liked:
      type: boolean
      description: 是否已点赞（点赞成功后恒为 true）
LikeCancelRequest:
  type: object
  description: CancelReq 取消点赞请求（按 product_id 幂等，未点赞/不存在也成功）。
  required:
    - product_id
  properties:
    product_id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: path
      x-go-validate: required
      description: 商品 id
LikeCancelResponse:
  type: object
  description: CancelRes 取消点赞响应（无业务字段）。
  properties: {}
  additionalProperties: false
LikeCheckRequest:
  type: object
  description: CheckReq 是否已点赞请求（独立鉴权查询，供商品详情展示点赞态）。
  properties:
    product_id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: query
      description: 商品 id（必填，缺失或 ≤0 返回 400）
LikeCheckResponse:
  type: object
  description: CheckRes 是否已点赞响应。
  required:
    - liked
  properties:
    liked:
      type: boolean
      description: 当前用户是否已点赞该商品
LikeCountRequest:
  type: object
  description: CountReq 公开点赞数请求（无需 token）。
  properties:
    product_id:
      type: integer
      format: int64
      x-go-type: int64
      x-in: query
      description: 商品 id（必填，缺失或 ≤0 返回 400）
LikeCountResponse:
  type: object
  description: CountRes 公开点赞数响应。
  required:
    - count
  properties:
    count:
      type: integer
      format: int64
      x-go-type: int
      description: 该商品点赞数（实时 COUNT 聚合）
Order:
  type: object
  description: Order 订单结构（查询与写接口复用）。
  required:
    - id
    - order_no
    - user_id
    - status
    - total_amount
    - original_amount
    - discount_amount
    - user_coupon_id
    - idempotency_key
    - recipient_name
    - phone
    - province
    - city
    - district
    - detail
    - address_id
    - expire_at
    - cancel_reason
    - paid_at
    - shipped_at
    - received_at
    - completed_at
    - cancelled_at
    - refunded_at
    - created_at
    - updated_at
    - items
  properties:
    id:
      type: integer
      format: int64
      x-go-type: int64
      description: 订单 id
    order_no:
      type: string
      description: 全局唯一订单号
    user_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 归属用户 id
    status:
      type: string
      enum: [pending_payment, paid, shipped, received, completed, cancelled, refunded]
      x-enum-labels:
        pending_payment: 待支付（DB 10）
        paid: 已支付（DB 20）
        shipped: 已发货（DB 30）
        received: 已收货（DB 40，实际不可观测）
        completed: 已完成（DB 50，终态）
        cancelled: 已取消（DB 60，终态）
        refunded: 已退款（DB 70，终态）
      x-known-issue:
        - id: B1-02-D2
          summary: received(40) 为事务内中间态，API 查询实际不可观测；枚举仍保留以匹配 DTO 与 DB
      description: 状态：pending_payment/paid/shipped/received/completed/cancelled/refunded
    total_amount:
      type: integer
      format: int64
      x-go-type: int64
      x-unit: cent
      description: 应付金额（整数分，快照 = original_amount - discount_amount）
    original_amount:
      type: integer
      format: int64
      x-go-type: int64
      x-unit: cent
      description: 优惠前金额（整数分，快照 = Σ 订单项 price×quantity）
    discount_amount:
      type: integer
      format: int64
      x-go-type: int64
      x-unit: cent
      description: 优惠金额（整数分，快照，无券为 0）
    user_coupon_id:
      type: [integer, "null"]
      format: int64
      x-go-type: int64
      description: 下单时使用的用户券 id（软引用，快照，无券为空）
    idempotency_key:
      type: string
      description: 幂等键
    recipient_name:
      type: string
      description: 收货人姓名快照
    phone:
      type: string
      description: 手机号快照
    province:
      type: string
      description: 省快照
    city:
      type: string
      description: 市快照
    district:
      type: string
      description: 区快照
    detail:
      type: string
      description: 详细地址快照
    address_id:
      type: [integer, "null"]
      format: int64
      x-go-type: int64
      description: 下单时地址 id（软引用，可空）
    expire_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 支付截止时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    cancel_reason:
      type: [integer, "null"]
      format: int64
      x-go-type: int
      enum: [1, 2, null]
      x-enum-labels:
        "1": 用户取消
        "2": 超时未支付自动取消
      description: 取消原因：1=用户、2=超时；未取消为 null
    paid_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 支付时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    shipped_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 发货时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    received_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 收货时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    completed_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 完成时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    cancelled_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 取消时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    refunded_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 退款时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    created_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 创建时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    updated_at:
      type: [string, "null"]
      x-go-type: gtime.Time
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: "2026-11-10 11:27:26"
      x-format: gtime-local
      description: 更新时间；格式 YYYY-MM-DD HH:MM:SS，不含时区偏移（当前实现限制，非 RFC3339）
    items:
      type: array
