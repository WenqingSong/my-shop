UploadFrontendTokenRequest:
  type: object
  description: FrontendTokenReq 前台签发七牛云上传凭证请求（Auth：登录用户）。 filename 与 content_type 均可选：filename 含扩展名，用于扩展名预校验与生成 key； content_type 为客户端声明 MIME，用于预校验。大小上限固化进 token 的 fsizeLimit 由七牛服务端执行。
  properties:
    filename:
      type: string
      description: 文件名（含扩展名，可选）
    content_type:
      type: string
      description: 客户端声明 MIME 类型（可选）
UploadAdminTokenRequest:
  type: object
  description: AdminTokenReq 后台签发七牛云上传凭证请求（AdminAuth：管理员）。
  properties:
    filename:
      type: string
      description: 文件名（含扩展名，可选）
    content_type:
      type: string
      description: 客户端声明 MIME 类型（可选）
UploadTokenResponse:
  type: object
  description: TokenRes 上传凭证响应：客户端用 token 向 upload_url 直传文件，上传成功后访问 final_url。
  required:
    - token
    - key
    - upload_url
    - domain
    - final_url
    - expires_at
  properties:
    token:
      type: string
      description: 七牛云上传凭证（客户端直传用）
    key:
      type: string
      description: 后端预生成的存储 key（写入 token scope）
    upload_url:
      type: string
      description: 上传主机（按 region 映射）
    domain:
      type: string
      description: 对外访问域名
    final_url:
      type: string
      description: 上传成功后可直接访问的地址（domain/key）
    expires_at:
      type: integer
      format: int64
      x-go-type: int64
      description: 凭证过期时间（unix 秒）
Success:
  type: object
  description: 统一成功响应包装：{code:0, message:"OK", data:<业务数据>}。data 的具体 Schema 由各 operation 的 allOf 覆盖；data 为 null 时表示该操作无返回体。
  required:
    - code
    - message
    - data
  properties:
    code:
      type: integer
      const: 0
      description: 业务码，成功恒为 0
    message:
      type: string
      const: OK
      description: 成功文案，恒为 OK
    data:
      description: 业务数据；类型由具体 operation 指定，可为 null
Error:
  type: object
  description: 统一失败响应：{code:<业务错误码>, message:<码表文案>, data:null}。客户端必须以 code 判定错误类型，不得依赖 message 文本。
  required:
    - code
    - message
    - data
  properties:
    code:
      type: integer
      minimum: 1
      description: 业务错误码；完整注册表见 components/error-codes.yaml
    message:
      type: string
      description: 码表固定文案，不拼接字段细节
    data:
      type: "null"
      description: 失败时恒为 null
