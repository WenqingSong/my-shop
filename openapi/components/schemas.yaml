    idempotency_key:
      type: string
      description: 幂等键
    activity_id:
      type: integer
      format: int64
      x-go-type: int64
      description: 活动 id
    sku_id:
      type: integer
      format: int64
      x-go-type: int64
      description: SKU id
FlashSaleGetOrderResultRequest:
  type: object
