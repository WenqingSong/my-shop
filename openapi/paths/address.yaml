            type: object
            properties:
              recipient_name:
                type: string
                description: 收货人姓名，trim 后 1~32 字符
              phone:
                type: string
                description: 手机号，格式 ^1[3-9]\d{9}$
              province:
                type: string
                description: 省（自由文本，非空）
              city:
                type: string
                description: 市（自由文本，非空）
              district:
                type: string
                description: 区（自由文本，非空）
              detail:
                type: string
                description: 详细地址，trim 后 1~255 字符
              is_default:
                type: [boolean, "null"]
                description: 是否默认地址；首条地址忽略此值自动置为默认
