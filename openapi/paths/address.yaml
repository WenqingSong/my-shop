/addresses:
  post:
    tags:
      - 收货地址
    summary: 创建收货地址
    description: 认证方式：用户 JWT。校验签名、有效期、type=user、Redis 会话有效、users.status=1 且 auth_epoch 匹配；任一失败返回 401/1002（身份类型不符为 403/1003）。
    operationId: addressCreate
    security:
      - bearerAuth: []
    x-auth: user
    x-handler: address.Create
    x-source: routes_frontend.go
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              recipient_name:
                type: string
                description: 收货人姓名，trim 后 1~32 字符
              phone:
                type: string
                description: 手机号，格式 ^1[3-9]\d{9}$
              province:
                type: string
                description: 省（自由文本，非空）
              city:
                type: string
                description: 市（自由文本，非空）
              district:
                type: string
                description: 区（自由文本，非空）
              detail:
                type: string
                description: 详细地址，trim 后 1~255 字符
              is_default:
                type: [boolean, "null"]
                description: 是否默认地址；首条地址忽略此值自动置为默认
    x-pagination-mode: none
    x-idempotency:
      mode: none
    responses:
      "200":
        description: 成功。响应体为 {code:0,message:"OK",data:<业务数据>}。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AddressCreateResponse'
      x-error-codes:
        codes:
          - 1000
          - 1001
          - 1002
          - 1003
          - 7001
          - 7002
        scope: call-chain
        note: controller→service→logic 调用链中实际引用的业务错误码 + 通用码；码值/HTTP/message 见 components/error-codes.yaml。
