    tags:
      - 运营数据大屏
    summary: 运营概览
    description: 认证方式：管理员 JWT（AdminAuth）。校验签名、有效期、type=admin、Redis 管理员会话、admins.status=1；失败返回 401/1002（身份类型不符为 403/1003）。权限码：`dashboard:view`；超级管理员（is_super=1）直接绕过该权限码校验，其余管理员按 roles→role_permissions→permissions 校验，未命中返回 403/1003。
    operationId: dashboardOverview
    security:
      - bearerAuth: []
    x-auth: admin
    x-permission: dashboard:view
    x-handler: dashboard.Overview
    x-source: routes_admin.go
    x-pagination-mode: none
    x-idempotency:
      mode: none
    responses:
      "200":
        description: 成功。响应体为 {code:0,message:"OK",data:<业务数据>}。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DashboardOverviewResponse'
      x-error-codes:
