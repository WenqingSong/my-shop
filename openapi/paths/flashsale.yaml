    operationId: flashSaleCreate
    security:
      - bearerAuth: []
    x-auth: admin
    x-permission: flash_sale:create
    x-handler: flashsale.Create
    x-source: routes_admin.go
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: 活动名，trim 后 1~64 字符
              start_time:
                type: [string, "null"]
                x-go-type: gtime.Time
                x-format: gtime-lenient
                description: 开始时间（必须早于结束时间）；请求侧为宽松解析：支持 YYYY-MM-DD HH:MM:SS、YYYY-MM-DD、RFC3339 等格式，无偏移值按服务端时区解释
