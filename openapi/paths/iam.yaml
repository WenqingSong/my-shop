/register:
  post:
    tags:
      - IAM
    summary: 注册新用户
    description: 公开接口，无需认证。
    operationId: userRegister
    security: []
    x-auth: public
    x-handler: iam.Register
    x-source: routes_frontend.go
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              username:
                type: string
                description: 用户名，3~24 位大小写字母或数字
              password:
                type: string
                description: 密码，8~24 位
    x-pagination-mode: none
    x-idempotency:
      mode: none
    responses:
      "200":
        description: 成功。响应体为 {code:0,message:"OK",data:<业务数据>}。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UserRegisterResponse'
      x-error-codes:
        codes:
          - 1000
          - 1001
          - 2001
        scope: call-chain
        note: controller→service→logic 调用链中实际引用的业务错误码 + 通用码；码值/HTTP/message 见 components/error-codes.yaml。
      "400":
        $ref: '#/components/responses/BadRequest'
      "409":
        $ref: '#/components/responses/Conflict'
      "500":
        $ref: '#/components/responses/InternalError'
