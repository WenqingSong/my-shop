/logout:
  post:
    tags:
      - IAM
    summary: 登出当前会话
    description: 认证方式：仅校验 JWT 签名、有效期与 type=user，不查询 Redis 会话；会话已撤销时仍可到达 handler（用于幂等登出）。 仅验签登出：JWT 签名与 type 合法即可到达 handler，不查询 Redis 会话，因此会话已撤销时重复登出仍返回成功（幂等）。
    operationId: userLogout
    security:
      - bearerAuth: []
    x-auth: user
    x-auth-mode: signature_only
    x-handler: iam.Logout
    x-source: routes_frontend.go
