    security:
      - bearerAuth: []
    x-auth: admin
    x-permission: sku:create
    x-handler: sku.Create
    x-source: routes_admin.go
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              product_id:
                type: integer
                format: int64
                x-go-type: int64
                x-go-validate: required
                description: 所属商品 id（必须存在）
              name:
                type: string
                x-go-validate: required
                description: SKU 名称，非空且不超过 128 字符
              price:
                oneOf: [{type: integer, format: int64}, {type: string, pattern: '^-?[0-9]+$'}]
                x-go-type: json.Number
                x-go-validate: required
                description: 价格（整数分，0~99999999）；接受 JSON 整数或数字字符串（GoFrame 绑定行为）
              status:
                type: [string, "null"]
                enum: [enabled, disabled, null]
                x-enum-labels:
                  enabled: 启用
                  disabled: 禁用
                description: 状态：enabled/disabled，默认 enabled
            required:
              - product_id
              - name
              - price
    x-pagination-mode: none
    x-idempotency:
      mode: none
    x-known-issue:
      - id: B1-02-D1
        summary: DTO gvalid 校验失败实际返回 HTTP 500 + code 51（框架码穿透），不是 400 + 1001
        actual_http_status: 500
        actual_business_code: 51
        remediation: 需单独立项在 codes.FromError / Response 中间件中把 gvalid 归一为 1001；B1-02 不修改错误码映射
    responses:
      "200":
        description: 成功。响应体为 {code:0,message:"OK",data:<业务数据>}。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SkuCreateResponse'
      x-error-codes:
        codes:
          - 1000
          - 1001
          - 1002
          - 1003
          - 4001
          - 5001
          - 5002
          - 5003
          - 5004
