    x-handler: spec.CreateGroup
    x-source: routes_admin.go
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              product_id:
                type: integer
                format: int64
                x-go-type: int64
                x-go-validate: required
                description: 所属商品 id（必须存在）
