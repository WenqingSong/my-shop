/qiniu/upload/token:
  get:
    tags:
      - 上传
    summary: 前台签发七牛云上传凭证
    description: 认证方式：用户 JWT。校验签名、有效期、type=user、Redis 会话有效、users.status=1 且 auth_epoch 匹配；任一失败返回 401/1002（身份类型不符为 403/1003）。
    operationId: uploadFrontendToken
    security:
      - bearerAuth: []
    x-auth: user
    x-handler: upload.FrontendToken
    x-source: routes_frontend.go
    parameters:
      - name: filename
        in: query
        required: false
        schema:
          type: string
        description: 文件名（含扩展名，可选）
      - name: content_type
        in: query
        required: false
        schema:
          type: string
        description: 客户端声明 MIME 类型（可选）
    x-pagination-mode: none
    x-idempotency:
      mode: none
    responses:
      "200":
        description: 成功。响应体为 {code:0,message:"OK",data:<业务数据>}。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UploadTokenResponse'
      x-error-codes:
        codes:
          - 1000
          - 1001
          - 1002
          - 1003
          - 17001
          - 17002
          - 17003
        scope: static-call-chain
        note: controller→service 与 logic 同包调用链中静态可达的业务错误码 + 经代码核实的跨包补充登记 + 通用码；这是静态上界，不表示运行时必然触发，也不覆盖按数据内容动态分派的分支。码值/HTTP/message 见 components/error-codes.yaml。
      "400":
        $ref: '#/components/responses/BadRequest'
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'
      "500":
        $ref: '#/components/responses/InternalError'
