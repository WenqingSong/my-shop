  - id: B1-02-D1
    summary: DTO gvalid 校验失败返回 HTTP 500 + code 51，与目标规范 400 + 1001 不一致
    affected: 14 条带 v:"required" 的写接口，见各 operation 的 x-known-issue
    remediation: 需单独立项修复错误码映射；B1-02 仅在契约层标注
  - id: B1-01-H15.4
    summary: 分页三种形态并存：clamp（静默归一）/ strict（越界 400）/ none（无分页）
    contract_representation: operation 级 x-pagination-mode
  - id: B1-01-H15.5
    summary: 响应时间格式为 YYYY-MM-DD HH:MM:SS 且不含时区偏移，不是 RFC3339
    contract_representation: '字段级 x-format: gtime-local 与 pattern；请求侧 x-format: gtime-lenient'
  - id: B1-01-H15.2
    summary: 同一状态概念存在 string 与 int 两套 JSON 表示（订单/退款/秒杀/优惠券）
    contract_representation: 按字段实际类型声明 enum，并用 x-enum-labels 给出数值含义
  - id: B1-02-D5
    summary: 幂等键仅支持 JSON body 字段，不支持 Idempotency-Key Header
    contract_representation: operation 级 x-idempotency（mode=body/query/none）
  - id: B1-01-H15.9
    summary: 10 个后台只读接口仅要求管理员身份，未绑定权限码
    affected: GET /admin/me、GET /admin/qiniu/upload/token、GET /admin/products、GET /admin/products/:id、GET /admin/inventories/:sku_id、GET /admin/inventories/:sku_id/logs、GET /admin/banners、GET /admin/banners/:id、GET /admin/recommend-positions、GET /admin/recommend-positions/:id
    contract_representation: 'operation 仅声明 x-auth: admin，不声明 x-permission'
  - id: B1-01-H15.8
    summary: 未匹配路由返回 404 text/plain "Not Found"，不经过统一 JSON 响应包装
    remediation: 需在服务层增加 404 兜底中间件；B1-02 不修改运行时行为
  - id: B1-01-H15.3
    summary: 无 CORS 中间件，浏览器跨域直连会被拦截，必须走同源代理
    remediation: B1-03 开发代理/Nginx 同源入口解决；不在 B1-02 修改
  - id: B1-01-H15.10
    summary: 成功空操作 data 语义二义：部分接口返回 null，部分返回 {}
    contract_representation: '按 handler 实际返回逐条声明（data: null 或 $ref 空对象）'
