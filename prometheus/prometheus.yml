# Prometheus 抓取配置（测试环境）。
#
# 抓取 my-shop 服务的 GET /metrics（Prometheus 文本格式）。该端点仅在
# flash_sale.metrics.enabled=true（环境变量 FLASH_SALE_METRICS_ENABLED）开启时由服务暴露。
#
# 网络说明：应用以宿主机进程监听 :8000（SERVER_ADDRESS 可覆盖），Prometheus 运行在容器内，
# 经 host.docker.internal:host-gateway（docker-compose 的 extra_hosts）访问宿主机端口。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# recording rules：秒杀下单接口 p95/p99 延迟查询（promtool check rules 校验，见 scripts/test-prometheus.sh）。
rule_files:
  - "/etc/prometheus/rules/flashsale_latency.yml"

scrape_configs:
  - job_name: my-shop
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - "host.docker.internal:8000"
