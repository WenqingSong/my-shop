# =============================================================================
# 未引用组件允许保留清单（B1-02-review-fix R3）
#
# 由 tools/openapi-gen -check 强制校验，规则：
#   1. 只有本文件逐项列名的组件才允许「未被任何 $ref 引用」；
#   2. 条目必须存在于 openapi/surgecart.openapi.yaml 的 components 中，否则报「过期记录」；
#   3. 条目若实际已被引用，报「应从清单移除」；
#   4. 任何未列名的未引用组件都会让检查失败；
#   5. 不允许按组件类型或名称通配，必须逐个列名。
#
# 判定口径：从 paths（含 planned）与 security requirement 出发，沿 $ref 递归可达即为「已引用」。
# 维护方式：新增 API/DTO 后如果检查失败，先确认该组件确实需要保留，再把名称加到对应分组。
# =============================================================================
version: 1

groups:
  # 142 条常驻 API 的完整请求 DTO。operation 的 requestBody/parameters 是「按字段位置拆分的
  # 内联子集」（path/query/body 分开生成），因此不会 $ref 完整 Req Schema。
  # 保留用途：DTO 全量覆盖审计（B1-02_DTO_SCHEMA_INVENTORY.md 与 components/schemas.yaml 双向核对）。
  - type: schemas
    category: dto-request
    reason: "operation 请求按字段位置内联生成，完整请求 DTO 仅用于 DTO 全量覆盖审计"
