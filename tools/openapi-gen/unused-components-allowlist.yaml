  # handler 显式返回 nil 的写接口：实际响应 data 为 null（operation 内声明 type: null），
  # 因此不会 $ref 空对象形态的 Res Schema。保留用途同上（DTO 全量覆盖审计）。
  - type: schemas
    category: dto-null-response
    reason: "handler 返回 nil，operation 的 data 声明为 null，空对象 Res Schema 仅用于 DTO 全量覆盖审计"
    names:
      - AdminAssignAdminRoleResponse
      - AdminAssignRolePermissionResponse
      - AdminDeleteAdminResponse
      - AdminDeletePermissionResponse
      - AdminDeleteRoleResponse
      - AdminLogoutResponse
      - AdminRemoveAdminRoleResponse
      - AdminRemoveRolePermissionResponse
      - UserLogoutResponse
      - UserRevokeAllResponse
      - UserRevokeOthersResponse
      - UserRevokeSessionResponse

  # 通用响应模板：operation 的 200 用 allOf 内联 Success + 具体 data，失败状态引用具名响应。
  - type: responses
    category: response-template
    reason: "通用响应模板，operation 通过 allOf / 具名响应间接表达，不直接 $ref"
    names:
      - ErrorResponse
      - SuccessResponse

  # D3 分页语义参考组件：operation 的分页参数由 DTO 内联生成。
  - type: parameters
    category: pagination-semantics
    reason: "D3 clamp/strict 两套分页语义的文档化组件，operation 参数由 DTO 内联生成"
    names:
      - PageClampParam
      - PageStrictParam
      - SizeClampParam
      - SizeStrictParam
